# Epic: JSONL Parsing

id: jsonl-parsing
name: JSONL Parsing and Session Loading
themes: [console-replay, local-exploration, compaction-recovery]

description: |
  Load and parse Claude Code session files in JSONL format.
  Handle multi-line JSON objects, format versions (1.x, 2.x),
  and graceful degradation for malformed content.
  Build unified chronological timeline from parsed events.

cli_flags: []  # No direct CLI flags, foundation for all other features

design_doc_refs:
  - parse_claude_jsonl.py (separate parser module)
  - design_decisions.md: Lazy Loading, Timeline Building

spec_files:
  - unit_tests_spec.py
  - edge_cases_spec.py

capabilities:
  - Parse JSONL with multi-line JSON objects
  - Assign sequence numbers to entries
  - Handle format version differences (1.x vs 2.x)
  - Graceful degradation for parse errors
  - Support both local files and stdin
  - Session discovery by substring matching
  - Extract all content block types (text, tool_use, tool_result, thinking)
  - Track meta flags (isMeta, isCompactSummary)
  - Parse slash command XML structure
  - Detect user interruptions
  - Preserve raw JSONL for passthrough export

stories:
  - PRS-001: Load session file by path (must)
  - PRS-002: Discover session by substring match (must)
  - PRS-003: Parse multi-line JSON objects in JSONL (must)
  - PRS-004: Continue processing despite parse errors (should)
  - PRS-005: Build unified chronological timeline (must)
  - PRS-006: Handle Claude Code format versions 1.x vs 2.x (must)
  - PRS-007: Parse slash commands from XML tags (should)
  - PRS-008: Extract bash content from XML tags (should)
  - PRS-009: Detect user interruptions in session (could)
  - PRS-010: Track isMeta and caveat message flags (should)
  - PRS-011: Load and parse agent transcript files (should)
  - PRS-012: Preserve raw JSONL objects for JSON/JSONL export (must)
  - PRS-013: Extract content blocks from message objects (must)

story_counts:
  total: 13
  new_in_synthesis: 2  # PRS-012, PRS-013

search_methodology: |
  Search day logs for:
  - "parse", "parsing", "JSONL", "JSON"
  - "multi-line", "multiline"
  - "format version", "1.x", "2.x"
  - "malformed", "error", "graceful"

  Search sessions for tool_use/tool_result handling discussions.

status: mined
