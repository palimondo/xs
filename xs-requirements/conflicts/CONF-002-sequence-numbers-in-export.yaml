id: CONF-002
title: Sequence Numbers in JSON/JSONL Export

description: |
  User noticed (e583:1587) that JSON/JSONL export does not include sequence
  numbers. Agent acknowledged the limitation and proposed adding a sequence/index
  field. However, this directly conflicts with the raw-passthrough contract
  (PRIN-003) which requires --json/--jsonl to output verbatim JSONL objects
  with no modifications.

evidence:
  request:
    - source: "e583:1587-1595"
      observation: "User noticed missing sequence numbers in export output"
    - source: "export report: EXP-004 proposed story"
      observation: "Agent proposed adding sequence field to export objects"

  conflict:
    - source: "a40c:545"
      observation: "User corrected --json to output raw JSONL, not transformed data"
    - source: "e583:1103"
      observation: "User reconfirmed raw passthrough requirement"

options:
  - id: A
    name: "No sequence numbers in export (preserve raw passthrough)"
    pros: [consistent with PRIN-003, simple, no object modification]
    cons: [users cannot correlate export events with timeline positions]

  - id: B
    name: "Inject sequence number as extra field"
    pros: [enables event correlation, useful for downstream processing]
    cons: [violates PRIN-003, modifies original objects]

  - id: C
    name: "Separate metadata envelope (wrapper object with seq + raw event)"
    pros: [preserves raw object inside envelope, adds correlation]
    cons: [changes output structure, downstream jq scripts need updating]

  - id: D
    name: "Optional --with-seq flag that injects sequence numbers"
    pros: [default preserves passthrough, opt-in for correlation]
    cons: [still modifies objects when flag used, complexity]

resolution: resolved
decided_by: user
decision_rationale: |
  Default --json/--jsonl preserves raw passthrough (PRIN-003). An optional
  --with-seq flag injects a sequence number field into each exported object.
  This preserves the raw contract by default while providing opt-in correlation.
  Selected option D.

affects:
  - EXP-001  # --json output
  - EXP-002  # --jsonl output
  - EXP-004  # Sequence numbers in export (proposed story)
  - PRIN-003 # Raw passthrough contract
