id: CONF-004
title: Slash Command Display Prefix

description: |
  User dislikes the ">" prefix on slash commands (0841:1257), but
  reconstruct.jq uses ">" prefix for all user messages including slash
  commands. The question is whether slash commands should have a distinct
  visual prefix (like "/" which matches their nature) or use the standard
  user message ">" prefix.

evidence:
  preference:
    - source: "0841:1257"
      observation: "User dislikes > prefix on slash commands"

  existing:
    - source: "console-formatting report: slash-command-prefix conflict"
      observation: "reconstruct.jq uses > prefix consistently for all user messages"

  symbols:
    - source: "console-formatting report: key_symbols"
      observation: "slash_command symbol listed as '/' in formatting report"

options:
  - id: A
    name: "Use '/' prefix for slash commands"
    pros: [matches user preference, visually distinguishes from regular user messages]
    cons: [differs from reconstruct.jq reference, breaks PRIN-001 if CC uses '>']

  - id: B
    name: "Use '>' prefix (same as all user messages)"
    pros: [consistent with reconstruct.jq, simpler, follows PRIN-001]
    cons: [user explicitly dislikes this]

  - id: C
    name: "No prefix — show '/compact' without any leading symbol"
    pros: [slash commands are self-identifying via '/' start]
    cons: [breaks visual consistency with other user messages]

resolution: resolved
decided_by: user
decision_rationale: |
  Era-dependent prefix, tied to CONF-001 auto-detect decision. CC 2.x uses
  ❯ (U+276F) for user message prompts (including slash commands). For 1.x
  rendering, > is used (matching reconstruct.jq). For 2.x rendering, ❯ is
  used (matching CC 2.x /export output). "Staying true to what gets
  /export-ed is the right call." Exact character and applicability to all
  user messages needs golden file verification during Pass 3. FMT-001 may
  need updating but deferred until golden files confirm the exact format.

pass3_corrections:
  - "No factual errors found. Verified against golden file schema and inventory."

affects:
  - FMT-012 # Slash command display format
  - PRIN-001 # Console fidelity (if CC uses > for slash commands)
