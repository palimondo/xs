id: CONF-004
title: "Slash command display prefix"

description: |
  The user stated "I dislike that you used > prefix also for these" about
  slash commands (0841:1257). But reconstruct.jq, the authoritative
  reference implementation, uses > prefix for slash commands because
  they ARE user messages. The story currently specifies > prefix matching
  reconstruct.jq but flags the conflict.

evidence:
  - source: "Group 2 tension T2"
    observation: "FMT-012: user dislikes > for slash commands, but reconstruct.jq uses it"
  - source: "FMT-012"
    observation: "Story specifies '> /command is running...' for truncated, '> /command' for compact"

options:
  - id: A
    name: "Keep > prefix (match reconstruct.jq)"
    pros: ["Consistent with authoritative reference", "Slash commands ARE user input", "Simpler"]
    cons: ["User expressed dislike"]

  - id: B
    name: "Use / prefix (no > prefix for slash commands)"
    pros: ["Visually distinct from regular user messages", "Honors user preference"]
    cons: ["Diverges from reconstruct.jq", "Slash commands are semantically user messages"]

  - id: C
    name: "Use > /command (keep > but the / is visual distinction enough)"
    pros: ["Consistent framing", "The slash itself distinguishes from regular messages"]
    cons: ["This is what reconstruct.jq does and the user still disliked it"]

resolution: resolved
decided_by: user
decision_rationale: |
  Era-dependent prefix, tied to CONF-006 (1.x vs 2.x) auto-detect.
  CC 2.x uses ❯ (U+276F) for user message prompts including slash
  commands. For 1.x rendering, > is used. For 2.x rendering, ❯ is used.
  "Staying true to what gets /export-ed is the right call."
  (Resolution carried from draft CONF-004.)

affects:
  - FMT-012
  - FMT-001
  - DSP-001
  - DSP-002

status: fresh
