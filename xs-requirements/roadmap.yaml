      - id: GFH-005
        title: "Deduplication"
        readiness: needs-beefing-up
        notes: "Skip already-downloaded. 3 ACs."

      - id: GFH-006
        title: "Timestamp setting"
        readiness: ready
        notes: "4 ACs. ctime=start/mtime=end, macOS SetFile for birth time, non-macOS fallback, duration logging."

      - id: GFH-007
        title: "File naming convention"
        readiness: ready
        notes: "5 ACs. Full filename format, date/time from createdAt, flat directory, github/ location, raw log fallback."

      - id: GFH-008
        title: "Fetch CLI interface"
        readiness: ready
        notes: "6 ACs. --limit, --run-id, --save-raw-logs, default behavior, skip messaging, success summary."

      - id: GFH-009
        title: "Fetch by issue/PR"
        readiness: needs-beefing-up
