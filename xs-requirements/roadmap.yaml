    internal_growth: |
      FetchPipeline (workflow listing → log download → JSONL extraction)
      MetadataExtractor (XML tags → issue/PR classification)
      FileNamer (structured convention, flat directory)
      Deduplicator (run ID from filenames)
      Independent subsystem — minimal coupling to xs core

  # ═══════════════════════════════════════════════════════════════════════
  # COMPACTION RECOVERY
  # ═══════════════════════════════════════════════════════════════════════

  - id: S13
