# ═══════════════════════════════════════════════════════════════════════
# SPEC FILE ORGANIZATION
# ═══════════════════════════════════════════════════════════════════════

spec_organization:
  description: |
    Outside-in ATDD: acceptance specs test xs as a black box (run CLI, assert
    output). Unit specs test internal collaborators discovered during implementation.
    Acceptance specs organized by slice (implementation order). Unit specs organized
    by module (emerging from implementation).

  acceptance_specs:
    description: |
      One spec file per slice. Each tests `xs` end-to-end using real fixtures.
      BDD naming: describe_*/it_* per project convention.
    files:
      - specs/acceptance/describe_walking_skeleton_spec.py
      - specs/acceptance/describe_summary_mode_spec.py
      - specs/acceptance/describe_compact_timeline_spec.py
      - specs/acceptance/describe_filtering_spec.py
      - specs/acceptance/describe_range_selection_spec.py
      - specs/acceptance/describe_truncated_full_modes_spec.py
      - specs/acceptance/describe_search_spec.py
      - specs/acceptance/describe_export_spec.py
      - specs/acceptance/describe_post_filter_limit_spec.py
      - specs/acceptance/describe_advanced_display_spec.py
      - specs/acceptance/describe_session_discovery_spec.py
      - specs/acceptance/describe_sidechain_spec.py
      - specs/acceptance/describe_fetch_pipeline_spec.py
      - specs/acceptance/describe_compaction_hooks_spec.py

  unit_specs:
    description: |
      Emerge during implementation. Expected structure based on internal
      growth predictions from each slice.
    expected_modules:
      - specs/unit/describe_parser_spec.py           # PRS-* (S0)
      - specs/unit/describe_timeline_builder_spec.py  # PRS-005 (S0/S2)
      - specs/unit/describe_summary_renderer_spec.py  # SUM-* (S0/S1)
      - specs/unit/describe_compact_renderer_spec.py  # DSP-001, FMT-* (S2)
      - specs/unit/describe_event_formatter_spec.py   # FMT-022, tool param extraction (S2)
      - specs/unit/describe_filter_pipeline_spec.py   # FLT-* (S3)
      - specs/unit/describe_range_parser_spec.py      # RNG-* (S4)
      - specs/unit/describe_truncated_renderer_spec.py # DSP-002 (S5)
      - specs/unit/describe_search_engine_spec.py     # SRC-* (S6)
      - specs/unit/describe_export_renderer_spec.py   # EXP-* (S7)
      - specs/unit/describe_session_discovery_spec.py  # PRS-002 (S10)
      - specs/unit/describe_fetch_pipeline_spec.py    # GFH-* (S12)
    note: |
      These are predictions. Actual modules emerge from test-driven design.
      If tests are hard to write, the design needs to change (GOOS principle).

# ═══════════════════════════════════════════════════════════════════════
# ARCHITECTURAL EMERGENCE NOTES
# ═══════════════════════════════════════════════════════════════════════

architectural_notes:
  description: |
    Where we expect ports/adapters and key abstractions to emerge.
    These are NOT prescribed designs — they're predictions of what
    the tests will drive us toward.

  expected_ports:
    - name: "SessionLoader"
      emerges_in: S0
      role: "Loads JSONL from file path or stdin"
      note: "Later grows to accept session UUID prefix (S10)"

    - name: "TimelineBuilder"
      emerges_in: S0
      role: "Converts parsed JSONL messages into timeline entries"
      note: "Grows from one-entry-per-message (S0) to content-block expansion (S2)"

    - name: "FilterPipeline"
      emerges_in: S3
      role: "Composes search → range → include → exclude → context → head/tail"
      note: "Steps added incrementally: S3 (include/exclude), S4 (range), S6 (search), S8 (head/tail)"

    - name: "Renderer"
      emerges_in: S0
      role: "Renders filtered timeline entries to stdout"
      note: |
        Starts as SummaryRenderer (S0). CompactRenderer (S2) and
        TruncatedRenderer (S5) derive from it. ExportRenderer (S7) is
        a separate branch. PRIN-012: truncated is canonical, others derive.

    - name: "EventFormatter"
      emerges_in: S2
      role: "Formats individual timeline entries (ToolName(param), symbols)"
      note: "Grows as new tool types and special message types are added"

  design_risks:
    - description: |
        Content polymorphism (PRIN-011) is pervasive. Parser MUST normalize
        before any downstream consumer sees content. If we skip this in S0,
        it will bite us in every subsequent slice.
      mitigation: "Handle both forms in PRS-013 (S0). Test with both fixtures."

    - description: |
        Filter-display boundary leak (FLT-012): -x Tool must suppress
        display-time announcements. This breaks clean separation.
      mitigation: "Accept as controlled boundary crossing. Pass exclude_filters to renderer."

    - description: |
        Format version detection (1.x vs 2.x) affects many downstream stories.
        If detection is wrong, rendering will be wrong.
      mitigation: "PRS-006 is in S0. Test with both 1.x and 2.x fixtures."

    - description: |
        Implicit mode activation (PRIN-009) has a mode-resolution hierarchy
        that can produce subtle bugs (duplicate output with search + timeline).
      mitigation: "Test explicitly for search overriding implicit timeline (CLI-006 AC4)."
