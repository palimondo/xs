acceptance_criteria:
  - id: SUM-001-AC1
    given: a valid JSONL session file with timestamps
    when: xs is invoked with only the session identifier (no flags)
    then: |
      Summary mode is displayed showing:
      1. Session filename (not UUID stem) as the header
      2. Metadata section with Started, Ended, Duration timestamps
      3. Timeline section with hierarchical event counts
      All output is valid, machine-parseable YAML with capitalized keys

  - id: SUM-001-AC2
    given: a JSONL session with multiple event types
    when: summary mode is displayed
    then: |
      Timeline section shows hierarchical tree:
        Events: N            # -t
        User inputs: N       # -U
        Tool results: N      # (shown after -T events, use --no-tool-results to exclude)
        Assistant: N         # -a
        Assistant messages:
          Text: N            # -a -x Tool
          Tool: N            # -T
          Tool calls:
            ToolName: N      # -i ToolName
      Each parent count equals the sum of its children.

  - id: SUM-001-AC3
    given: a JSONL session with various tool types
    when: summary mode shows tool calls breakdown
    then: |
      Tool calls are listed sorted by count descending.
      Tools with zero invocations are omitted entirely.

  - id: SUM-001-AC4
    given: summary mode output
    when: reading the inline comments
    then: |
      Each count has a brief inline YAML comment showing the
      CLI parameter combination to view just that event type.
      Comments show only flag combinations, not descriptive text.

  - id: SUM-001-AC5
    given: a GitHub CI session without timestamps
    when: summary mode is displayed
    then: |
      Metadata section (Started/Ended/Duration) is gracefully omitted.
      Timeline section still displays event counts normally.

  - id: SUM-001-AC6
    given: a session with user interruptions and slash commands
    when: summary mode is displayed
    then: |
      User interruptions are labeled "User interruptions".
      Slash commands and ! commands are counted correctly.

  - id: SUM-001-AC7
    given: any filter, range, or include/exclude parameter is present
    when: xs is invoked with those parameters
    then: |
      Timeline display mode is implicitly activated instead of summary.
      Summary mode only appears with no output-mode parameters (bare invocation).

