# Story: Edit Tool Formatting

id: FMT-004
title: Format Edit tool calls with file path
epic: console-formatting
theme: console-replay

as_a: developer reviewing session output
i_want: Edit tool calls displayed as Edit(filepath) matching Claude Code console
so_that: I can see what files were modified

sources:
  - session: "1e83:348"
    quote: "We had this issue also with read file and write file that you've added arrows there."
    context: "User rejecting arrow decorations for Edit/Write/Read tools"
  - session: "1e83:493"
    quote: "elif tool_name in ['Edit', 'Write', 'MultiEdit']:"
    context: "Agent implementing standard format for Edit/Write/MultiEdit tools"
  - session: "b475:1380"
    quote: "[104] ⏺ Edit(/Users/palimondo/Developer/BookMinder/bookminder/apple_books/library.py)"
    context: "Actual output showing Edit tool with file_path parameter"
  - session: "e583:456"
    quote: "The tests are expecting the OLD format with arrows (Read: ← /target.py) but you already changed the implementation to match Claude Code's format (Read(/target.py))"
    context: "Confirms migration from arrow format to CC parenthesis format"

acceptance_criteria:
  - id: FMT-004-AC1
    given: Edit tool_use entry in JSONL
    when: rendered in truncated mode
    then: "Display as '⏺ Edit({file_path})' where file_path is the .input.file_path field"

  - id: FMT-004-AC2
    given: Write tool_use entry in JSONL
    when: rendered in truncated mode
    then: "Display as '⏺ Write({file_path})'"

  - id: FMT-004-AC3
    given: MultiEdit tool_use entry in JSONL
    when: rendered in truncated mode
    then: "Display as '⏺ MultiEdit({file_path})'"

  - id: FMT-004-AC4
    given: Edit/Write/MultiEdit tool_use entry
    when: rendered in compact mode
    then: "Display as '[N] ⏺ Edit({file_path})' on a single line"

depends_on:
  - PRS-005  # Must parse JSONL tool_use entries
related:
  - PRIN-001  # Console fidelity
  - FMT-003  # Bash tool (same pattern)
  - FMT-005  # Read tool (same pattern)
  - FMT-007  # Tool results

status: mined
validation_notes: |
  User explicitly rejected arrow format (Edit: -> file, Write: -> file).
  Correct format is ToolName(file_path) matching Claude Code console.
  Applies to Edit, Write, and MultiEdit tools uniformly.
  Source: 1e83:348, 1e83:493, b475:1380, e583:456
