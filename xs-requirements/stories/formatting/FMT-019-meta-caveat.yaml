# Story: Meta/Caveat Message Handling

id: FMT-019
title: Handle isMeta and caveat messages
epic: console-formatting
theme: console-replay

as_a: developer reviewing session output
i_want: meta and caveat messages handled appropriately
so_that: system messages are distinguishable from user input

sources:
  - session: "0841:1159"
    quote: "this marks it as a metadata message, not a regular user message"
    context: "isMeta:true field marks protocol/metadata messages"
  - session: "0841:1174"
    quote: "[1] is marked as [META] - a protocol message with isMeta: true"
    context: "Display format for meta messages: [META] prefix"
  - session: "0841:1122"
    quote: "Skipping the caveat message and the actual user message"
    context: "reconstruct.jq skips caveat messages entirely"
  - session: "1e83:710"
    quote: "[1] [META] Caveat: The messages below were generated by the user while running local commands."
    context: "Actual output showing caveat message with [META] prefix"
  - session: "0841:1124"
    quote: "is that before any slash command or only custom slash commands?"
    context: "User clarifying caveat message appears before custom slash commands"

acceptance_criteria:
  - id: FMT-019-AC1
    given: user message with isMeta:true field
    when: rendered in compact mode
    then: "Display with '[META]' prefix: '[N] [META] {content}'"

  - id: FMT-019-AC2
    given: caveat message (standard text about local commands)
    when: rendered in truncated mode
    then: "Display the caveat text (not skipped)"

  - id: FMT-019-AC3
    given: caveat message
    when: displayed
    then: "Do NOT use > prefix (caveat is not user input)"

  - id: FMT-019-AC4
    given: isMeta:true messages
    when: filtering for user messages
    then: "Meta messages may be excluded from user message filters"

depends_on:
  - PRS-010  # Must parse isMeta field
related:
  - FMT-012  # Slash commands (caveats precede custom slash commands)
  - FMT-001  # User message formatting (meta messages are NOT regular user input)

status: mined
validation_notes: |
  isMeta:true field in JSONL marks protocol/metadata messages.
  Display as [META] prefix in compact mode.
  Caveat message is always the same text about local commands.
  Do NOT use > prefix for meta messages (0841:1257).
  Source: 0841:1159, 0841:1174, 0841:1122
