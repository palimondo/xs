# Story: Thinking Block Display in Truncated Mode

id: FMT-011
title: Display thinking blocks with content preview
epic: console-formatting
theme: console-replay

as_a: developer reviewing session output
i_want: thinking blocks shown with content preview in compact mode
so_that: I can see what Claude was thinking without verbose output

sources:
  - session: "1e83:729"
    quote: "The thinking message in compact mode shoudl also include the first and last line from the thoughts separated with [...] -- check for precedents, we already do that for other message types"
    context: "User requesting thinking blocks show content preview using same pattern as other multiline content"
  - session: "1e83:735"
    quote: "For multiline content in compact mode, we show: First line, [...], Last line (if different from first)"
    context: "Agent confirming the first [...] last pattern applies to thinking blocks"
  - session: "b475:1484"
    quote: "are we outputting the Claude's Thinking? -- This seems like another Meta tool parameter, where we shoul say something like --include Thinking"
    context: "User considers thinking as a filterable type via --include Thinking"

acceptance_criteria:
  - id: FMT-011-AC1
    given: thinking block with multiline content
    when: rendered in compact mode
    then: "Display as '[N] ✻ Thinking... {first_line} [...] {last_line}'"

  - id: FMT-011-AC2
    given: thinking block with single line content
    when: rendered in compact mode
    then: "Display as '[N] ✻ Thinking... {content}'"

  - id: FMT-011-AC3
    given: thinking block
    when: rendered in truncated mode
    then: "Display as '✻ Thinking...' without full thinking content (matches CC console)"

depends_on:
  - FMT-006  # Thinking block symbol
  - FMT-008  # Multiline truncation pattern
related: []

priority: should
status: mined
validation_notes: |
  Compact mode: thinking blocks include first [...] last preview.
  Truncated mode: thinking blocks show header only (matching CC console).
  Thinking may be filterable via --include Thinking (b475:1484, unresolved).
  Source: 1e83:729, 1e83:735
