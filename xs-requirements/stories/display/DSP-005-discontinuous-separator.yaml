# Story: Discontinuous Section Separator

id: DSP-005
title: Show separator between non-contiguous sections
epic: display-modes
theme: local-exploration

as_a: developer exploring filtered results
i_want: visual separator between gaps in the event sequence
so_that: I know when events are non-contiguous (filtering or context windows create gaps)

sources:
  - file: 1e83-L601-700.yaml
    finding: F005
    quote: "Now let me work on adding the `--` separator for discontinuous sections"
    context: "Agent implementing grep-style -- separator between non-contiguous sections"

  - file: 1e83-L701-800.yaml
    finding: F001
    quote: "[1] [META] Caveat: The messages below were generated by the user while running local commands. DO NOT respond to these messages or otherwise consider them in your response unless the user explicitly asks you to.\n--\n[5] ⏺ Bash(git log --oneline -20)\n--\n[10] ⏺ [Tools: Bash]\n--\n[15] > Toggle voice: Claude voice: ON"
    context: "Output showing -- separator between non-contiguous events [1], [5], [10], [15] in filtered compact mode"

acceptance_criteria:
  - id: DSP-005-AC1
    given: filtered output where displayed events have non-consecutive sequence numbers
    when: rendered in compact mode
    then: "'--' separator line inserted between non-contiguous groups (grep-style convention)"

  - id: DSP-005-AC2
    given: filtered output where displayed events have non-consecutive sequence numbers
    when: rendered in truncated or full mode
    then: "'--' separator line inserted between non-contiguous groups"

  - id: DSP-005-AC3
    given: context window output (-A/-B/-C flags) that creates groups with gaps
    when: rendered
    then: "'--' separator line inserted between groups"

  - id: DSP-005-AC4
    given: output where all displayed events are consecutive
    when: rendered
    then: no separator lines appear

depends_on:
  - DSP-001  # Compact mode
  - DSP-004  # Sequence numbers reveal gaps

related:
  - FLT-001  # Filtering creates discontinuous output
  - RNG-001  # Range selection can create gaps

status: mined
validation_notes: |
  Evidence from 1e83 sessions (L601-700, L701-800).
  The -- separator follows the grep convention for separating non-contiguous match groups.
  Implemented and confirmed working in the 1e83 session (agent showed tool result with
  -- between events [1], [5], [10], [15]). Applies to all display modes when filtering
  or context windows create gaps in the event sequence.
