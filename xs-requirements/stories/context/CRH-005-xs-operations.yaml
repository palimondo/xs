    context: "User requests --jq and --tail flags to find last compaction event in full mode"
  - session: 760a:401-500
    quote: "future session can: `./xs 760a9954 -S \"commit|tdd-guard|decision block\"`"
    context: "xs -S supports regex/keyword search patterns for finding prior context"
  - session: 760a:401-500
    quote: "in case of compaction that doesn't trigger the post-compaction context review and recovery using `xs`, read the docs from 1"
    context: "xs is also the manual fallback when automatic hook-based recovery fails"

acceptance_criteria:
  - id: CRH-005-AC1
    given: recovery prompt
    when: searching for compaction summary
    then: uses `xs {session} -S "This session is being continued"` or `xs {session} --jq 'select(.isCompactSummary == true)' --tail 1 --full`

  - id: CRH-005-AC2
    given: recovery prompt
    when: reading compaction summary
    then: uses `xs {session} {event_index} --full`

  - id: CRH-005-AC3
    given: recovery prompt
    when: checking todo state
    then: uses `xs {session} -i TodoWrite` (pipe to tail for last occurrence)

  - id: CRH-005-AC4
    given: recovery prompt
    when: searching decisions
    then: uses `xs {session} -S "decision|approach|should"` (regex alternation)

  - id: CRH-005-AC5
    given: recovery prompt
    when: filtering by tool invocation
    then: uses `xs {session} -i {ToolName}` to filter by specific tool

  - id: CRH-005-AC6
    given: manual recovery fallback
    when: automatic hook does not trigger
    then: user can manually run xs commands to recover context

depends_on:
