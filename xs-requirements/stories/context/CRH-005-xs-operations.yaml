status: mined
validation_notes: |
  Rich evidence from 760a and e583 sessions demonstrating xs CLI in compaction
  recovery workflows. Key xs operations:
  - -S for text search (supports regex alternation)
  - -i for tool invocation filtering
  - --full for complete content display
  - Event index for specific event access
  - --jq for arbitrary jq filtering (requested but may not be implemented)
  - --tail for post-filter slicing (requested but may not be implemented)
  The isCompactSummary field enables robust compaction detection vs text matching.
  Note: --jq and --tail are requested features (e583:1601-1700) that may not exist yet.
