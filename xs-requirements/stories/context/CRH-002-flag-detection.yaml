# Story: Compaction Flag Detection

id: CRH-002
title: Detect compaction flag on tool use
epic: context
theme: compaction-recovery

as_a: developer after compaction
i_want: flag detected before first tool use
so_that: recovery is triggered immediately

sources:
  - file: ~/Developer/BookMinder/.claude/hooks/pretooluse_context_recovery_hook.py
    lines: 17-28
  - session: 760a:201-300
    quote: "can you try using `xs` to check current session (you should know the session-id from the compaction hook's temp file I think?) and see if you read it?"
    context: "User expects session_id to be available from the flag file for passing to xs"
  - session: e583:1301-1400
    quote: "OK, I think that in order for these hooks to work, they need to be on project's .claude in hooks something something, check @hooks.md"
    context: "Hooks must be placed in project's .claude/hooks/ directory per Claude Code conventions"
  - session: e583:1401-1500
    quote: "the robust way to find compaction events is to look for JSON events with \"isCompactSummary\": true"
    context: "JSONL format has dedicated isCompactSummary boolean field for detecting compaction events"

acceptance_criteria:
  - id: CRH-002-AC1
    given: PreToolUse hook triggered
    when: checking for flags
    then: searches for /tmp/.claude_compaction_*.json pattern

  - id: CRH-002-AC2
    given: flag file found
    when: processing
    then: reads session_id from flag data

  - id: CRH-002-AC3
    given: flag file processed
    when: complete
    then: deletes flag to prevent repeated triggers

  - id: CRH-002-AC4
    given: hook placement
    when: configuring hooks
    then: hook scripts reside in project's .claude/hooks/ directory

depends_on:
  - CRH-001
related:
