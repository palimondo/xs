# Story: Workflow Run Listing

id: GFH-001
title: List workflow runs from GitHub Actions
epic: fetch
theme: github-fetch

as_a: developer fetching session logs
i_want: to list recent workflow runs from Claude workflows
so_that: I can identify which runs to download

sources:
  - session: f9c7:1601-1700
    finding: F003
    quote: "are you listing all runs without filtering for Claude Code and success on server? I thought --limit 50 would be quivalent to `gh run list -w \"Claude Code\" -s success -L 50`"
    context: "User insists --limit N must return N successful runs via server-side filtering, not N total runs of mixed status"

  - session: 0841:501-600
    finding: F001
    quote: "we are not downloading CC runs form PR reviews"
    context: "fetch_logs scripts must fetch from both claude.yml and claude-code-review.yml workflows"

  - session: 0841:501-600
    finding: F002
    quote: "the other one is in .github/workflows/claude-code-review.yml"
    context: "Two distinct GitHub Actions workflows to combine: claude.yml (issues) and claude-code-review.yml (PRs)"

  - session: cc2d:501-600
    finding: F002
    quote: "we are not downloading CC runs form PR reviews"
    context: "User correction — scripts were only fetching claude.yml runs, missing PR review workflow"

  - file: day-024:34201-34400
    finding: F003
    quote: "if run['conclusion'] == 'skipped':"
    context: "Skip runs with conclusion='skipped' (bot-triggered duplicates)"

  - file: day-024:34201-34400
    finding: F004
    quote: "if run['workflowName'] != 'Claude Code':"
    context: "Only process runs from the 'Claude Code' workflow"

  - file: day-024:33801-34000
    finding: F010
    quote: "Skip runs with conclusion=\"skipped\" (failed condition checks)"
    context: "Only archive runs with conclusion=success or failure, not skipped runs"

acceptance_criteria:
  - id: GFH-001-AC1
    given: GitHub repo with Claude workflows
    when: listing runs with --limit N
    then: returns up to N recent successful runs, filtering by success status server-side (not client-side)

  - id: GFH-001-AC2
    given: both claude.yml and claude-code-review.yml workflows exist
    when: listing runs
    then: combines runs from both workflows into a single list

  - id: GFH-001-AC3
    given: combined run list
    when: sorting
    then: sorts by createdAt descending

  - id: GFH-001-AC4
    given: combined run list includes skipped/cancelled runs
    when: filtering
    then: excludes runs with conclusion='skipped' (bot-triggered duplicates)

depends_on: []
related:
  - GFH-002
  - GFH-005

priority: must
status: mined
validation_notes: |
  Workflow names hardcoded: claude.yml, claude-code-review.yml.
  Server-side status filtering critical — --limit N should count only successful runs.
  Skipped runs are caused by claude[bot] comment triggers and should be silently excluded.
