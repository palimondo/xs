acceptance_criteria:
  - id: GFH-009-AC1
    given: CLI invocation with --issue N or --pr N
    when: fetching
    then: uses gh api to retrieve issue/PR comments

  - id: GFH-009-AC2
    given: issue/PR comments retrieved
    when: scanning for Claude's sticky comment
    then: finds Claude bot's comment containing workflow run link(s)

  - id: GFH-009-AC3
    given: run ID(s) extracted from sticky comment
    when: fetching
    then: downloads and extracts JSONL for each identified run

  - id: GFH-009-AC4
    given: multiple runs found for an issue/PR
    when: fetching
    then: downloads all sessions (unless already deduplicated by GFH-005)

