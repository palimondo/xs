acceptance_criteria:
  - id: GFH-010-AC1
    given: any feature change to fetch_logs.py
    when: committing
    then: equivalent change must be made to fetch_logs.sh

  - id: GFH-010-AC2
    given: same input (same GitHub repo, same runs)
    when: running either script
    then: produces identical output files (same names, same content, same timestamps)

  - id: GFH-010-AC3
    given: files created by fetch_logs.py
    when: running fetch_logs.sh subsequently
    then: deduplication correctly skips runs already fetched by the other script

