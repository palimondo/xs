# Story: Python and Shell Script Parity

id: GFH-010
title: Maintain feature parity between fetch_logs.py and fetch_logs.sh
epic: fetch
theme: github-fetch

as_a: developer using fetch tools
i_want: both Python and shell versions to behave identically
so_that: I can use either script interchangeably

sources:
