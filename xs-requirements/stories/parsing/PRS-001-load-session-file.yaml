# Story: Load Session File

id: PRS-001
title: Load session file by path
epic: jsonl-parsing
theme: local-exploration

as_a: developer exploring session history
i_want: to load a JSONL session file by its absolute path
so_that: I can explore its contents

sources:
  - session: 0841:301-400
    finding: F003
    quote: "that script should be able to accept absolute path to session log and give you statistic about number of things... and then you should be able to list a range of calls (start with first ten or so?"
    context: "User specifies core PRS-001 requirement: accept absolute path, show statistics, list range of calls"

  - session: day-025:3401-3600
    finding: F002
    quote: "I'm now intrigues to play with the session extractor... waht's the curent state of our tools? I see you're modyfying apythonf file to use it, so I guess it's not yet a CLI i could use?"
    context: "Genesis of explore_session.py as a proper CLI tool"

  - session: day-025:3801-4000
    finding: F003
    quote: "JSONL session log format (multi-line JSON, not standard JSONL)"
    context: "Session files are multi-line JSON format, not standard single-line JSONL"

  - session: f9c7:801-900
    finding: F002
    quote: "ideally I would replace all day-*.md files with session logs. But I suspect that for my marathon sessions the jsonl files are much bugger (filesize and line count-wise) than console log, which only has truncated truncated tools I/O."
    context: "JSONL sessions contain full tool I/O vs truncated console output; xs must work from JSONL"

  - session: a40c:1401-1500
    finding: F001
    quote: "the JSONL parsing is imported from `parse_claude_jsonl`"
