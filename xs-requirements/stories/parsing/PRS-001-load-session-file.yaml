  - session: day-025:801-1000
    finding: F001
    quote: "Examine the JSONL file structure without reading the whole 500KB file"
    context: "GitHub Actions session JSONL files can be 500KB+; parser must be efficient"

acceptance_criteria:
  - id: PRS-001-AC1
    given: a valid absolute path to a JSONL session file
    when: passed as the first positional argument
    then: the file is loaded and parsed into structured objects

  - id: PRS-001-AC2
    given: a JSONL file from a local Claude session (~/.claude/projects/)
    when: loaded
    then: all events are parsed including user, assistant, and system types

  - id: PRS-001-AC3
    given: a JSONL file from GitHub Actions (github/*.jsonl)
    when: loaded
    then: all events are parsed correctly (these lack user input events)

  - id: PRS-001-AC4
    given: a non-existent file path
    when: passed as the first argument
    then: a clear error message is shown

  - id: PRS-001-AC5
    given: a large JSONL file (500KB+)
    when: loaded
    then: parsing completes without timeout or excessive memory usage

depends_on: []

related:
  - PRS-002  # Fuzzy discovery as alternative to full path
  - PRS-003  # Multi-line JSON parsing (the actual parse logic)
  - PRS-006  # Format version handling

status: mined
validation_notes: |
  Core entry point for all xs functionality. Session file loading is the foundation
  that all other features depend on. GitHub Actions sessions lack user messages
  (non-interactive mode) while local sessions have full conversation.
