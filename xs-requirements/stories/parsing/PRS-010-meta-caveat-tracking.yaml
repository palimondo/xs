# Story: isMeta and Caveat Message Tracking

id: PRS-010
title: Track isMeta and caveat message flags
epic: jsonl-parsing
theme: local-exploration

as_a: developer exploring sessions
i_want: isMeta and caveat flags tracked in parsed events
so_that: system/protocol messages can be identified and formatted differently from user input

sources:
  - session: 0841:1101-1200
    finding: F003
    quote: "this marks it as a metadata message, not a regular user message"
    context: "JSONL user messages with isMeta:true are protocol/metadata messages, not user input"

  - session: 0841:1101-1200
    finding: F004
    quote: "[1] is marked as `[META]` - a protocol message with `isMeta: true`"
    context: "Meta messages should be visually distinguished in display (shown as [META] prefix)"

  - session: 0841:1101-1200
    finding: F002
    quote: "so, [1] is a message to Claude that next thing will be output from custom slash-command and that it is not a typed user input. is that before any slash command or only custom slash commands?"
    context: "Caveat message only precedes custom slash commands, not built-in commands"

  - session: 0841:1201-1300
    finding: F001
    quote: "BTW some of the user messages had a userType:external or something like that I believe any insights we shoudl use base on that observation?"
    context: "userType field investigation concluded it is always 'external' and carries no useful signal"

  - session: 1e83:701-800
    finding: F001
    quote: "[1] [META] Caveat: The messages below were generated by the user while running local commands. DO NOT respond to these messages or otherwise consider them in your response unless the user explicitly asks you to."
    context: "Full caveat message text and [META] display format"

  - session: e583:1501-1600
    finding: F001
    quote: "The robust way to detect compaction events in JSONL is to look for the **`\"isCompactSummary\": true`** field"
    context: "isCompactSummary:true is another boolean flag on user messages for compaction detection"

acceptance_criteria:
  - id: PRS-010-AC1
    given: a user message with isMeta:true
    when: parsed
    then: the event is flagged as meta/protocol and available for distinct formatting

  - id: PRS-010-AC2
    given: a user message with caveat content ("Caveat: The messages below...")
    when: parsed
    then: the event is identified as a caveat message

  - id: PRS-010-AC3
    given: a user message with isCompactSummary:true
    when: parsed
    then: the event is flagged as a compaction summary

  - id: PRS-010-AC4
    given: a regular user message (no isMeta, no isCompactSummary)
    when: parsed
    then: no special flags are set

  - id: PRS-010-AC5
    given: a user message with userType field
    when: parsed
    then: the userType field is ignored (always "external", no signal)

depends_on:
  - PRS-001

related:
  - FMT-019  # Meta message display formatting
  - PRS-007  # Slash commands are preceded by caveat messages
  - CRH-001  # Compaction recovery uses isCompactSummary

priority: should
status: mined
validation_notes: |
  Three boolean flags on user messages are relevant for parsing:
  1. isMeta:true - protocol/metadata messages (caveat before custom slash commands)
  2. isCompactSummary:true - compaction event markers
  3. userType:"external" - always external, no signal (ignore)
  The caveat message is always the same text and only precedes custom slash
  commands. The [META] prefix is used in compact display mode.
