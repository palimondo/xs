acceptance_criteria:
  - id: EXP-003-AC1
    given: a parsed session
    when: --export-json RANGE OUTPUT is specified with a file path
    then: writes a JSON array of raw JSONL objects for the specified range to the output file

  - id: EXP-003-AC2
    given: "--export-json with RANGE and OUTPUT set to '-'"
    when: "'-' is specified as the OUTPUT argument"
    then: writes the JSON array to stdout instead of a file
    notes: "Enables pipeline composition without intermediate files (day-025:5303)"

  - id: EXP-003-AC3
    given: --export-json with --include filters
    when: Tool(glob) include patterns are specified
    then: only events matching ANY include pattern are exported
    notes: "Include is OR-logic: match ANY pattern to be included"

  - id: EXP-003-AC4
    given: --export-json with --exclude filters
    when: Tool(glob) exclude patterns are specified
    then: events matching ANY exclude pattern are removed from the export
    notes: "Exclude applied AFTER include filtering"

  - id: EXP-003-AC5
    given: --export-json with --include and --exclude
    when: both filters are specified
    then: |
      filter pipeline is: (1) select events in range, (2) keep events matching
      ANY include pattern, (3) remove events matching ANY exclude pattern
    notes: "User confirmed include-first semantics in day-025:5216-5245"

  - id: EXP-003-AC6
    given: --export-json RANGE
    when: RANGE uses parse_range syntax
    then: supports single index (5), range (1-50), open-end (50-), relative from start (+10), relative from end (-20)
    notes: "Range syntax unified with other commands (b475:1877)"

  - id: EXP-003-AC7
    given: exported JSON file
    when: consumed by a sub-agent for replay
    then: each tool call object contains name, id, and parameters fields sufficient for replay
    notes: "Primary use case is session replay by sub-agents (fa1a:905, b722:49)"

depends_on:
