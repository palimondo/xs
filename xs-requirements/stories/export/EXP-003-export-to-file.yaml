# Story: Export Range to JSON File

id: EXP-003
title: Export range to JSON file
epic: export
theme: console-replay

as_a: developer replaying sessions
i_want: to export a filtered range of events to a JSON file
so_that: I can replay specific tool calls via sub-agents or reconstruct.jq

