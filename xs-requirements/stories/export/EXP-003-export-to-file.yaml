related:
  - EXP-001  # JSON array to stdout (--json)
  - EXP-002  # JSONL to stdout (--jsonl)
  - FLT-001  # Include filter
  - FLT-002  # Exclude filter
  - RNG-001  # Range selection

priority: should
status: mined
validation_notes: |
  Extensively evidenced across b722, day-025, fa1a, 0841/cc2d, a40c, b475.
  Key design decisions:
  1. Renamed --export to --export-json for clarity (0841:672, b475:72)
  2. Takes RANGE OUTPUT (2 args, not START END OUTPUT 3 args) after b475:1877
  3. Supports '-' for stdout output (day-025:5303, b722:49)
  4. Include/exclude filters apply within the export range (day-025:4725-5400)
  5. Filter semantics: include=OR whitelist, exclude=AND blacklist, applied in sequence
  6. Output is JSON array of raw JSONL objects for machine consumption by sub-agents
  7. Tool(glob) filter syntax: Edit(*/specs/**), Bash(git commit *) etc.
