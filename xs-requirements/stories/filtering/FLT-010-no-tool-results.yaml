# Story: Exclude Tool Results

id: FLT-010
title: --no-tool-results flag
epic: filtering
theme: local-exploration

as_a: developer exploring a session
i_want: to see tool calls without their output
so_that: I can get a compact view of actions

sources:
  - file: "a40c:1-100"
    line: 100
    speaker: user
    type: user_request
    quote: "When filtering for tools, exclude their results (default: include results)"
    context: "CLI help: tool results included by default; flag to suppress them"

  - file: "caf2:201-300"
    line: 288
    speaker: user
    type: user_correction
    quote: "tool call and tool response are two sepparate events in the timeline. We have decided to include the tool response for each tool call, but we've added option to suppress it, so that we can support the toll call replay use case with --JSON flag"
    context: "--no-tool-results suppresses tool_result user events that follow tool calls; not about truncating output within a result"

  - file: "b475:1801-1900"
    line: 1832
    speaker: agent
    type: agent_proposal
    quote: "The `--no-tool-results` flag is working - it's showing only the tool calls without their results"
    context: "--no-tool-results confirmed working: shows only tool_use entries without tool_result responses"

  - file: "b475:1801-1900"
    line: 1823
    speaker: agent
    type: agent_proposal
    quote: "no-tool-results] [--show-numbers] [--full]"
    context: "--no-tool-results is a CLI flag alongside --show-numbers and --full"

  - file: "caf2:1-100"
    line: 7
    speaker: user
    type: user_request
    quote: "Implement CLI flags for controlling timeline display (--no-tool-results, --show-numbers)"
    context: "From session continuation summary: --no-tool-results is a display control flag"

  - file: "a40c:201-300"
    line: 292
    speaker: agent
    type: agent_proposal
    quote: "[9] ⏺ TodoWrite: Updated 3 todos (1 in_progress, 2 pending)\n\n[13] ⏺ Read: ← /Users/palimondo/Developer/BookMinder/specs/cli_spec.py"
    context: "--no-tool-results with -T: shows tool name + summary but hides full tool result content"

acceptance_criteria:
  - id: FLT-010-AC1
    given: session with tool calls and results
    when: --no-tool-results is specified
    then: tool_result events are suppressed from output

  - id: FLT-010-AC2
    given: session with tool calls
    when: --no-tool-results is NOT specified (default)
    then: tool results are shown after their corresponding tool calls

  - id: FLT-010-AC3
    given: --no-tool-results flag
    when: combined with -T (tools only)
    then: shows a compact list of tool invocations without any result output

  - id: FLT-010-AC4
    given: tool_result event
    when: it is a separate timeline event from tool_use
    then: --no-tool-results filters out these separate tool_result events

depends_on:
  - FLT-004
related:
  - FLT-009  # -T shortcut

priority: should
status: mined
validation_notes: "User corrected agent's misunderstanding: this suppresses separate tool_result events, not truncating content within a result. Key for JSON replay use case."
