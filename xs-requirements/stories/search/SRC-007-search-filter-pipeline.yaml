priority: must
status: mined
validation_notes: |
  Pipeline ordering stated twice by user (caf2:301-400 and caf2:901-1000).
  Implementation bug confirmed and fixed: search was ignoring -i/-x.
  Known gap: tail-of-search-results not expressible with current pipeline ordering.
  User requested careful UX coherence design for all filter interactions.
