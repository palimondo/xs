acceptance_criteria:
  - id: CLI-008-AC1
    given: a CLI invocation
    when: flags are specified before the session positional argument
    then: all flags parse correctly (e.g. `xs -U -a -x Tool <session> +14`)

  - id: CLI-008-AC2
    given: the --help output
    when: short and long forms are listed
    then: they follow a consistent ordering convention throughout

  - id: CLI-008-AC3
    given: short flag assignments
    when: -S is used for --search
    then: -S does not conflict with -s/--summary (which uses -s)

  - id: CLI-008-AC4
    given: virtual entity shortcut flags
    when: assigned short forms
    then: use uppercase letters (-M, -U, -T) to avoid conflicts with grep/rg flags; -a is lowercase (exception)

  - id: CLI-008-AC5
    given: output in any mode
    when: displayed
    then: no section headers like === TIMELINE ===, === FILE CHANGES ===, === CONVERSATION === appear in output

  - id: CLI-008-AC6
    given: the xs tool
    when: invoked
    then: the tool name is `xs` (short for explore-session), accessible as a command without specifying full path

