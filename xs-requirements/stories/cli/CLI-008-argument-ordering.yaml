# Story: Argument Ordering and Help Text

id: CLI-008
title: Argument ordering rules and help text conventions
epic: cli-interface
theme: local-exploration

as_a: developer using xs
i_want: consistent argument ordering rules and well-formatted help text
so_that: I can reliably compose complex invocations and learn the tool from --help

sources:
  - file: 1e83-L801-900.yaml
    finding: F002
    line: 836
    speaker: user
    type: user_request
    quote: "Oh, I just tried running `./explore_session.py -U -a -x Tool 943dff12 +14` which works, so I guess I wa"
    context: "CLI options must be specified BEFORE the positional session argument. Correct order: flags, session, ranges."

  - file: 1e83-L701-800.yaml
    finding: F003
    line: 781
    speaker: user
    type: user_correction
    quote: "`./explore_session.py 943dff12 +14` works\n`./explore_session.py 943dff12 -U -a -x Tool +14` doesn't work"
    context: "Argparse breaks when flags appear after positional session argument combined with +N range syntax"

