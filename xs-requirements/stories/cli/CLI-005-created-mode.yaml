acceptance_criteria:
  - id: CLI-005-AC1
    given: a valid session file
    when: invoked with -c or --created
    then: displays only files that were newly created (Write tool calls for new files)

  - id: CLI-005-AC2
    given: --created mode
    when: files were created during the session
    then: shows each created file with its event index, filename, and a brief content preview

  - id: CLI-005-AC3
    given: --created mode
    when: content preview is displayed
    then: content is indented under the filename with truncation indicated by ellipsis

