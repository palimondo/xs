group: 3
name: Features
epics: [search, context, sidechain, summary]
story_count: 20
analyzed_at: 2026-02-27

patterns:
  - id: P1
    name: "grep/rg CLI convention mirroring"
    description: |
      The search epic consistently mirrors grep/rg conventions: -S for search,
      uppercase -A/-B/-C for context lines, -- as gap separator between
      non-contiguous results. The CLI is explicitly designed to feel familiar
      to grep/rg users (SRC-001 source e583:1-100 F002). This extends to
      behavior: context windows must merge overlapping regions and never
      produce duplicate output, exactly as grep does.
    evidence: ["SRC-001", "SRC-002", "SRC-003", "SRC-004", "SRC-006"]
    scope: cross-group  # affects CLI-002 design

  - id: P2
    name: "five-step filter pipeline ordering"
    description: |
      A canonical 5-step pipeline governs all filtering: (0) search, (1) range,
      (2) include, (3) exclude, (4) context expansion. This was stated by the
      user twice (caf2:301-400 and caf2:901-1000) and confirmed as the
      authoritative design. Context expansion (-A/-B/-C) happens LAST,
      after all filtering, and must merge overlapping windows without
      duplication. This pipeline is the single most cross-cutting pattern
      in the search and filtering epics.
    evidence: ["SRC-001", "SRC-002", "SRC-003", "SRC-004", "SRC-007"]
    scope: cross-group  # affects FLT-*, RNG-*, DSP-*

  - id: P3
    name: "summary as self-documenting tutorial"
    description: |
      Summary mode is explicitly designed as a tutorial for the tool. Each
      count line has an inline YAML comment showing the CLI flag combination
      to view just that event type (e.g. "# -i Bash", "# -U"). The summary
      output must be valid, machine-parseable YAML. This serves both human
      discoverability and machine consumption.
    evidence: ["SUM-001", "SUM-002", "SUM-003"]
    scope: cross-group  # affects CLI-001, DSP-001

  - id: P4
    name: "hierarchical arithmetic consistency in summary"
    description: |
      Summary counts form a tree where children must sum to their parent.
      Zero-count entries are omitted. Tool calls are sorted descending by
      count. Git operations nest under Bash; MCP tools nest by server prefix.
      The user explicitly called out arithmetic inconsistency as something
      to prevent (b475:301-400 F008).
    evidence: ["SUM-001", "SUM-002", "SUM-003"]
    scope: within-group

  - id: P5
    name: "raw JSONL passthrough for --json/--jsonl"
    description: |
      When --json or --jsonl output mode is used, raw JSONL objects must pass
      through unmodified. No fields should be stripped or transformed. This
      is critical for sidechain handling (isSidechain field preservation)
      and was explicitly stated as a user requirement (e583:1101-1200 F001).
      This pattern touches export, sidechain, and filtering concerns.
    evidence: ["SID-003", "SID-001"]
    scope: cross-group  # affects DSP-003, EXP-*, PRS-005

  - id: P6
    name: "two-hook architecture for compaction recovery"
    description: |
      Compaction recovery uses a two-hook pattern: PreCompact creates a flag
      file, PreToolUse detects it and blocks tool use with recovery prompt.
      This is necessary because PostCompact does not exist in the Claude Code
      hooks API. The flag file is session-scoped (/tmp/.claude_compaction_{id[:8]}.json)
      for multi-instance safety.
    evidence: ["CRH-001", "CRH-002", "CRH-003", "CRH-004"]
    scope: within-group

  - id: P7
    name: "sidechain events are inline, not special"
    description: |
      Sidechain events from Task sub-agents appear inline in the timeline
      as regular events without special marking. Summary counts include
      sidechain events. This was confirmed by characterization testing
      (e583:1001-1100) after an initial incorrect conclusion that they
      were invisible.
    evidence: ["SID-001", "SID-002", "SID-003"]
    scope: within-group

  - id: P8
    name: "search must handle content polymorphism"
    description: |
      Search (and by extension all text operations) must handle the fact
      that message.content can be an array or a string, and tool_result
      content can be a string or an array. Failure to handle this causes
      AttributeError crashes. This is documented as SRC-001-BUG1 and
      SID-002-AC2, and connects to established fact #9 and #10.
    evidence: ["SRC-001", "SID-002"]
    scope: cross-group  # affects PRS-* content parsing

  - id: P9
    name: "implicit mode activation by flag presence"
    description: |
      The CLI has an implicit mode selection rule: no flags = summary mode;
      any filter/range/search flag = timeline mode. When search is active,
      it IS the output mode -- implicit timeline must not activate separately
      and produce duplicate output. This was a critical bug (SRC-005,
      caf2:801-900, caf2:901-1000).
    evidence: ["SRC-005", "SUM-001"]
    scope: cross-group  # affects CLI-001, DSP-001

  - id: P10
    name: "xs as session analysis tool, not current-state tool"
    description: |
      xs is for exploring past/other sessions. Current session state should
      use native Claude Code tools. The user explicitly corrected the agent
      when it used xs to check current session TODOs (760a:401-500). In
      compaction recovery, xs is the primary tool for session analysis,
      replacing direct filesystem exploration.
    evidence: ["CRH-006", "CRH-005"]
    scope: cross-group  # affects overall tool design philosophy

constraints:
  - id: C1
    name: "search is simple substring, not regex"
    description: |
      Search uses simple case-insensitive substring matching, not ripgrep
      or regex. User asked about rg delegation; implementation confirmed
      as simple substring. However, CRH-005-AC4 mentions regex alternation
      patterns like "commit|tdd-guard|decision block" -- this creates a
      tension (see T2).
    evidence: ["SRC-001"]

  - id: C2
    name: "no duplicate or out-of-order output"
    description: |
      User explicitly stated that outputting the same message multiple times
      or out of order is a "serious bug that must be fixed immediately"
      (caf2:1001-1100 F004). Context expansion merge must be deduplicated.
      Search + implicit timeline must not produce double output.
    evidence: ["SRC-004", "SRC-005", "SRC-001"]

  - id: C3
    name: "summary output must be valid YAML"
    description: |
      Summary output uses YAML aesthetic AND must be valid, machine-parseable
      YAML (b475:301-400 F005). Keys are capitalized. Inline comments use
      YAML comment syntax (#). This constrains formatting choices.
    evidence: ["SUM-001"]

  - id: C4
    name: "hook API: permissionDecision/permissionDecisionReason only"
    description: |
      PreToolUse hooks must use permissionDecision: deny with
      permissionDecisionReason for the recovery prompt. additionalContext
      only works for SessionStart/UserPromptSubmit. The deprecated
      decision/block format causes 400 errors.
    evidence: ["CRH-003"]

  - id: C5
    name: "hooks require manual /hooks reload"
    description: |
      Hook scripts do not auto-reload when modified. User must trigger
      /hooks to reload. This is a practical constraint for hook
      development workflow.
    evidence: ["CRH-007"]

  - id: C6
    name: "token counts not available in JSONL"
    description: |
      Token count data is NOT available in JSONL session format.
      Summary must not attempt to show token usage.
    evidence: ["SUM-001"]

  - id: C7
    name: "git detection must handle cd-prefixed commands"
    description: |
      Git operation detection cannot assume git is the first word in a
      Bash command. Commands like "cd dir && git commit" must be detected.
      This is a known issue from CONF-003.
    evidence: ["SUM-003"]

  - id: C8
    name: "GitHub CI sessions lack timestamps"
    description: |
      Sessions from GitHub Actions may not have timestamp fields. Summary
      metadata section (Started/Ended/Duration) must gracefully degrade
      when timestamps are absent.
    evidence: ["SUM-001"]

tensions:
  - id: T1
    name: "tail-of-search-results not expressible"
    description: |
      The canonical pipeline applies range (step 1) before search (step 0
      selects, but step 1 range filters the timeline positions, not search
      result positions). This means -N (tail N events) applies to the
      timeline before search narrows it, so "last N search results" cannot
      be expressed. The user proposed a --tail flag for post-filter slicing
      (e583:1601-1700) but it may not exist yet. This is a known gap that
      affects both search (SRC-007) and compaction recovery (CRH-005, CRH-007).
    stories: ["SRC-007", "CRH-005", "CRH-007"]
    possible_resolution: |
      Add a --tail flag that applies AFTER the full pipeline (step 5),
      distinct from range (step 1). The user explicitly proposed this.

  - id: T2
    name: "simple substring vs regex/alternation patterns"
    description: |
      SRC-001 explicitly states search is "simple substring match, not regex."
      However, CRH-005-AC4 shows the user expecting regex alternation:
      `xs 760a9954 -S "commit|tdd-guard|decision block"`. If search is
      truly simple substring, the | character would be searched literally,
      not as alternation. Either the user's expectation changed, or "simple
      substring" means something different in context.
    stories: ["SRC-001", "CRH-005"]
    possible_resolution: |
      Clarify with user whether -S should support regex or remain pure
      substring. The user's grep/rg familiarity (P1) suggests regex may
      be desired despite the "simple substring" statement.

  - id: T3
    name: "sidechain filtering without explicit flag design"
    description: |
      SID-003 describes filtering sidechain events in/out, but notes "No
      flag syntax was discussed or decided." AC1 and AC2 are speculative.
      The story itself notes it may need splitting: AC3 (metadata
      preservation in --jsonl) is confirmed, but AC1/AC2 are unconfirmed.
      Meanwhile, sidechain events lack visual distinction (SID-001).
    stories: ["SID-001", "SID-003"]
    possible_resolution: |
      Implement AC3 (raw passthrough preserving isSidechain) as part of
      the JSON/JSONL passthrough principle (P5). Defer AC1/AC2 sidechain
      filter flag to a future story or merge into FLT-* epic.

  - id: T4
    name: "context expansion applies to filters too, not just search"
    description: |
      SRC-002-AC2 states "-A used with include/exclude filters (not just
      search)" shows context around filter results. But the pipeline has
      context expansion as step 4, after include/exclude (step 2-3). If
      -A is used with -i but no -S, what constitutes a "match" for context
      expansion? Is every event that passes the filter pipeline a "match"?
      This interaction is under-specified.
    stories: ["SRC-002", "SRC-004", "SRC-007"]
    possible_resolution: |
      Define "match" as any event that survives all prior pipeline steps.
      Context expansion adds neighbors around these survivors. This is
      consistent with grep behavior where -A applies to pattern matches,
      and here filters serve as the "pattern."

  - id: T5
    name: "-C combined with -A or -B behavior undefined"
    description: |
      SRC-004-AC4 notes: "Interaction between -C and -A/-B not explicitly
      documented in findings; needs design decision." If user specifies
      both -C 3 and -A 5, does -A override the after-portion of -C?
      Or is it an error?
    stories: ["SRC-004"]
    possible_resolution: |
      Follow grep convention: -C sets both, -A/-B can override one side.
      Alternatively, make them mutually exclusive with a clear error.

  - id: T6
    name: "--jq and --tail flags: requested but possibly unimplemented"
    description: |
      CRH-005 references --jq and --tail as features the user explicitly
      requested (e583:1601-1700). These would enable arbitrary jq filtering
      on JSONL events and post-pipeline tail slicing. They appear in
      acceptance criteria (CRH-005-AC1) but may not have stories of their
      own. --tail also resolves T1.
    stories: ["CRH-005", "CRH-007", "SRC-007"]
    possible_resolution: |
      Check if --jq and --tail have dedicated stories in other epics
      (likely CLI or filtering). If not, they need stories created.
      --tail is critical for resolving the pipeline ordering gap (T1).

