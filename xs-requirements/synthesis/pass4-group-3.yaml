cross_epic_concerns:
  - description: |
      The 5-step filter pipeline (P2) is the primary cross-group contract.
      Search (step 0), range (step 1), include (step 2), exclude (step 3),
      and context expansion (step 4) span search, filtering, and
      range-selection epics. Any change to pipeline ordering affects all three.
    affects: ["filtering (FLT-001, FLT-002)", "range-selection (RNG-001)", "cli-interface (CLI-002)"]

  - description: |
      Raw JSONL passthrough (P5) affects export and display-modes epics.
      SID-003 discovered that xs --jsonl was stripping metadata fields
      (isSidechain, parentUuid, userType). The user explicitly requires
      --json/--jsonl to emit unmodified JSONL objects.
    affects: ["export (EXP-*)", "display-modes (DSP-003)", "jsonl-parsing (PRS-005)"]

  - description: |
      Content polymorphism (P8) -- message.content as array or string,
      tool_result content as string or array -- causes crashes in search.
      This is fundamentally a parsing concern (PRS-*) that manifests in
      search and sidechain stories.
    affects: ["jsonl-parsing (PRS-005, PRS-012, PRS-013)"]

  - description: |
      Summary mode (SUM-001) defines implicit CLI mode selection: no flags
      means summary, any filter/range/search flag means timeline. This is
      a cli-interface and display-modes concern.
    affects: ["cli-interface (CLI-001)", "display-modes (DSP-001)"]

  - description: |
      The compaction recovery epic (CRH-*) is a consumer of xs features
      from search, filtering, range, and display-modes epics. It defines
      real-world usage patterns that validate those features work correctly
      in combination: search + range + context, filter by tool, --full mode,
      --jq, --tail.
    affects: ["search", "filtering", "range-selection", "display-modes"]

  - description: |
      MCP tool grouping (SUM-002) and git detection (SUM-003) require
      parametrized filter patterns like Tool(mcp__memory*) and --git (-g)
      shortcut. These features live in the filtering epic but are surfaced
      by summary.
    affects: ["filtering (FLT-001, FLT-003)", "cli-interface (CLI-003)"]

established_fact_impacts:
  - fact: "Fact #9: Content format polymorphism: message.content can be array (24478) or string (1944)"
    affected_stories: ["SRC-001", "SID-002"]
    impact: |
      SRC-001-BUG1 (AttributeError when content is a list) and SID-002-AC2
      directly reflect this fact. Search implementation must handle both
      content formats. These stories correctly identify the polymorphism
      issue. No correction needed, but implementation must use the
      established fact's frequency data (array is 12.5x more common
      than string) to prioritize the array case.

  - fact: "Fact #10: tool_result content can be string (7658) or array (38)"
    affected_stories: ["SRC-001", "SID-002"]
    impact: |
      Same as fact #9 -- the AttributeError crash in search occurs when
      encountering list-type tool_result content. The array case is rare
      (38 vs 7658) but must not crash. Stories correctly document this.

  - fact: "Fact #3: Synthetic fixtures are unreliable -- they encode buggy formats and lack uuid/sessionId/version fields"
    affected_stories: ["SUM-001", "SUM-002", "SUM-003", "SID-001"]
    impact: |
      Summary and sidechain stories reference characterization tests and
      existing behavior. Golden files for summary output format should be
      derived from real sessions, not synthetic fixtures. Any test fixtures
      for summary validation need uuid/sessionId/version fields to be
      realistic.

  - fact: "Fact #5: CC 2.x uses TaskCreate/TaskUpdate instead of TodoWrite"
    affected_stories: ["CRH-005", "SUM-001"]
    impact: |
      CRH-005-AC3 references "xs {session} -i TodoWrite" for checking
      todo state. In 2.x sessions, this should be TaskCreate/TaskUpdate
      instead. Summary tool counts (SUM-001) must handle both naming
      conventions depending on format version.

  - fact: "Fact #6: MultiEdit and LS tools present in 1.x but absent from 2.x"
    affected_stories: ["SUM-001", "SUM-002"]
    impact: |
      Summary tool breakdown must handle format-version-specific tool
      names. A 1.x session may show LS/MultiEdit in tool counts while
      a 2.x session will not. This interacts with the 1.x vs 2.x
      format conflict (CONF-001).

  - fact: "Fact #7: New 2.x event types: progress (hook_progress), stop_hook_summary, queue-operation"
    affected_stories: ["SUM-001"]
    impact: |
      Summary event counts must account for 2.x-specific event types.
      The hierarchical tree design should handle these gracefully --
      they may need new categories or be counted under a catch-all.

  - fact: "Fact #8: New 2.x fields: agent_id, agent_transcript_path, todos, modelUsage"
    affected_stories: ["SID-001", "SID-003", "CRH-005"]
    impact: |
      agent_id and agent_transcript_path may be relevant for identifying
      sidechain events in 2.x format (alongside isSidechain). CRH-005
      recovery operations may benefit from modelUsage data if available
      in 2.x. These are enhancement opportunities, not corrections.
