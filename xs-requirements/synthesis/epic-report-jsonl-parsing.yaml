key_requirements_discovered:
  - Multi-line JSON is the critical parsing challenge (not standard JSONL)
  - Unified timeline with gapless sequence numbers is the central data structure
  - Substring matching for session discovery (NOT type-specific parsing)
  - All content types must appear in timeline (text, tool_use, tool_result, thinking)
  - Raw JSONL objects must be preserved for passthrough export
  - isMeta, isCompactSummary, and userType fields require distinct handling
  - Format version detection via version field in system events
  - Tool results arrive as user messages with tool_result content blocks
  - Slash commands use XML tags (<command-message>, <command-name>)
  - Two types of interruption patterns in JSONL

cross_epic_dependencies:
  - FMT-*: All formatting stories depend on parsed content blocks
  - FLT-*: Filtering stories depend on timeline and content classification
  - RNG-*: Range selection stories depend on timeline sequence numbers
  - DSP-*: Display mode stories depend on timeline and content blocks
  - SUM-*: Summary stories depend on timeline statistics
  - CRH-*: Compaction recovery depends on isCompactSummary detection
  - GFH-*: GitHub fetch produces session files that parsing loads
  - SID-*: Sidechain stories depend on agent file loading (PRS-011)
  - EXP-*: Export stories depend on raw JSONL passthrough (PRS-012)

