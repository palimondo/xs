epic_id: jsonl-parsing
epic_name: JSONL Parsing and Session Loading
synthesized_by: opus

summary: |
  The jsonl-parsing epic is the foundation layer for all xs functionality.
  It covers loading session files, parsing multi-line JSON format, building
  a unified chronological timeline, handling format version differences,
  and extracting structured data from JSONL event objects.

stories_populated: 13
stories_original: 11
stories_new: 2

new_stories:
  - id: PRS-012
    title: Preserve raw JSONL objects for JSON/JSONL export
    rationale: |
      Multiple user corrections (a40c:501-600, e583:1101-1200) explicitly
      require that --json/--jsonl export modes output raw JSONL objects
      unmodified. The parser must retain the original objects alongside
      the parsed/structured timeline. This is a must-priority requirement.

  - id: PRS-013
    title: Extract content blocks from message objects
    rationale: |
      Content block extraction is a distinct parsing concern from timeline
      building. Assistant messages contain arrays of typed content blocks
      (text, tool_use, thinking); user messages contain either strings or
      arrays with tool_result blocks. The user corrected the parser when
      thinking blocks were ignored (a40c:201-300). This step transforms
      raw JSONL objects into the structured entries that timeline building
      uses.

