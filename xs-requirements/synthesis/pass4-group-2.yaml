cross_epic_concerns:
  - description: |
      All formatting stories (FMT-*) depend on parsing stories (PRS-005 through PRS-010)
      to extract structured data from raw JSONL. The formatting epic cannot function
      without the parsing epic's output.
    affects: ["jsonl-parsing"]

  - description: |
      Display mode selection (DSP-001/002/003) interacts with the CLI interface epic
      for flag parsing (--truncated, --full, --show-numbers are CLI flags). The display
      modes also interact with filtering (FLT-*) since filtering determines WHICH events
      are rendered, and display determines HOW.
    affects: ["cli-interface", "filtering"]

  - description: |
      Export stories (EXP-001/002/003) interact with the filtering epic (FLT-001, FLT-002)
      and range selection epic (RNG-001, RNG-004) because exports respect the same
      filter/range pipeline as display modes.
    affects: ["filtering", "range-selection"]

  - description: |
      Sequence number stability (P7) affects the range-selection epic. Range selection
      uses sequence numbers to specify event ranges (e.g., '5-10', '50-'). If sequence
      numbers are unstable, range selection breaks.
    affects: ["range-selection"]

  - description: |
      The filter-display separation principle (P12) requires coordination between
      this group and the filtering group. The filtering pipeline must produce a
      list of selected events with stable sequence numbers, and the display/export
      layer must render them without re-filtering.
    affects: ["filtering"]

  - description: |
      FMT-022 (generic tool format) has implications for MCP tools (mcp__provider__tool)
      which are part of the parsing/sidechain epics. The parameter extraction chain
      needs to handle MCP tool input structures.
    affects: ["jsonl-parsing", "sidechain-handling"]

  - description: |
      EXP-003 (export to file) mentions Tool(glob) filter syntax like
      Edit(*/specs/**) and Bash(git commit *). This filter syntax is defined
      in the filtering epic but its application to export is a cross-concern.
    affects: ["filtering"]

  - description: |
      The context flags (-A, -B, -C for lines before/after matches) mentioned in
      DSP-005-AC3 and FMT-018-AC3 are defined in the context epic but produce
      discontinuous output that this group must render correctly.
    affects: ["context"]

established_fact_impacts:
  - fact: "Fact 1: 'Bash: $ command' format was an xs bug, NOT real CC 1.x console format"
    affected_stories: ["FMT-003"]
    impact: |
      FMT-003 validation_notes reference user rejecting 'Bash: $ command' format (1e83:348).
      This is consistent with established fact 1. No story change needed -- FMT-003 already
      specifies the correct Bash(command) format. The bug was in the old implementation,
      not in the requirements.

  - fact: "Fact 2: '//voice:' format was an xs bug, NOT CC console format"
    affected_stories: []
    impact: |
      No stories in this group reference the //voice: format. No impact.

  - fact: "Fact 3: Synthetic fixtures are unreliable"
    affected_stories: ["FMT-007", "FMT-016"]
    impact: |
      FMT-007 and FMT-016 reference indentation patterns from day-021 sessions where
      the agent was working with fixtures. Golden files for these stories should be
      derived from real sessions, not synthetic fixtures. This affects Pass 3 golden
      file assembly for tool result indentation verification.

  - fact: "Fact 4: CC 1.x never sends parallel tool calls (always 1 tool_use per assistant message)"
    affected_stories: ["FMT-002"]
    impact: |
      FMT-002-AC4 specifies compact format for tool-only assistant messages as
      '[N] ⏺ [Tools: ToolName1, ToolName2]' with a plural list format. Since
      CC 1.x only has 1 tool per message, this plural format only applies to 2.x
      sessions. The story should note that 1.x will always have a single tool name.
      This connects to CONF-001 (1.x vs 2.x format differences).

  - fact: "Fact 5: CC 2.x uses TaskCreate/TaskUpdate instead of TodoWrite"
    affected_stories: ["FMT-020", "FMT-010"]
    impact: |
      FMT-020 defines special display for TodoWrite/TodoRead with status symbols
      and priority codes. In 2.x sessions, the equivalent is TaskCreate/TaskUpdate.
      FMT-010 covers Task tool generically but doesn't include the Todo-like special
      display. The stories need to be reconciled: either FMT-020 should cover both
      1.x (TodoWrite) and 2.x (TaskCreate/TaskUpdate) variants, or a new story
      should handle the 2.x equivalent.

  - fact: "Fact 6: MultiEdit and LS tools present in 1.x but absent from 2.x"
    affected_stories: ["FMT-004", "FMT-022"]
    impact: |
      FMT-004-AC3 specifies MultiEdit formatting. FMT-022-AC3 specifies LS formatting.
      These tools are 1.x only. Stories should note the version scope. For 2.x sessions,
      these tool names will not appear in the JSONL.

  - fact: "Fact 9: Content format polymorphism: message.content can be array or string"
    affected_stories: ["FMT-001", "FMT-002", "FMT-006", "FMT-022"]
    impact: |
      Multiple FMT stories reference .message.content[0].text for content extraction.
      When content is a string (1,944 occurrences vs 24,478 arrays), the [0].text
      path fails. All formatting stories that extract text content must handle both
      content formats. This is primarily a parsing concern (PRS-*) but affects the
      formatting stories' assumptions about input structure.

  - fact: "Fact 10: tool_result content can be string or array"
    affected_stories: ["FMT-007", "FMT-009", "FMT-015", "FMT-021"]
    impact: |
      Tool result formatting stories assume a specific content structure. When
      tool_result content is an array (38 occurrences) vs string (7,658), the
      display logic must handle both. FMT-007 references reconstruct.jq checking
      'if toolUseResult | type == "string"' which is the correct polymorphic handling.
