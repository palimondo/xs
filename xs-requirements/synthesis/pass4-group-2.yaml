group: 2
name: Display/Output
epics: [formatting, display, export]
story_count: 34
analyzed_at: 2026-02-27

patterns:
  - id: P1
    name: "Unified symbol vocabulary"
    description: |
      All display modes share a fixed set of Unicode symbols with strict semantic meaning:
      > for user messages, ⏺ for assistant text and tool calls, ⎿ for tool results,
      ✻ for thinking blocks, ! for local bash commands, @ for file references.
      No emojis are ever used. This is enforced as a hard constraint (FMT-025)
      and repeated corrections from the user (b475:966, b475:981, b475:1017).
    evidence: ["FMT-001", "FMT-002", "FMT-003", "FMT-006", "FMT-007", "FMT-013", "FMT-014", "FMT-025", "DSP-002"]
    scope: within-group

  - id: P2
    name: "Display mode hierarchy: CC console -> truncated -> compact"
    description: |
      The three display modes form a derivation chain. Truncated mode is the
      canonical rendering that replicates Claude Code console output. Compact mode
      is truncated mode compressed to one line per event with [seq] prefix added.
      Full mode is truncated mode with the 3-line tool result limit removed.
      All modes share the same symbol vocabulary and tool parameter formatting.
    evidence: ["DSP-001", "DSP-002", "DSP-003", "FMT-003", "FMT-004", "FMT-005"]
    scope: within-group

  - id: P3
    name: "ToolName(param) generic format"
    description: |
      All tool calls use the format ToolName(primary_param) with a parameter
      extraction priority chain: .command > .file_path > .path > .pattern > fallback.
      This applies to Bash, Edit, Write, Read, Grep, Glob, LS, Task, WebSearch, etc.
      Only TodoWrite/TodoRead have special display handling. The user explicitly
      rejected alternative formats (dollar sign, arrow decorations, tabs).
    evidence: ["FMT-003", "FMT-004", "FMT-005", "FMT-010", "FMT-022", "FMT-020"]
    scope: within-group

  - id: P4
    name: "Multiline content truncation: first [...] last"
    description: |
      In compact mode, all multiline content (user messages, assistant text, tool
      parameters, tool results, thinking blocks) uses a consistent pattern:
      first_line [...] last_line on a single line. No arbitrary character truncation
      (e.g., no 60-char limits). This enables reliable grep/head/tail workflows.
    evidence: ["FMT-008", "FMT-011", "DSP-001"]
    scope: within-group

  - id: P5
    name: "Tool result truncation in truncated mode: first 3 lines + total count"
    description: |
      In truncated mode, tool results show first 3 lines then '... +N lines' where
      N is the TOTAL line count (not remaining). Interactive elements like
      '(ctrl+r to expand)' are explicitly excluded. Assistant text messages are
      NOT truncated in truncated mode -- only tool results are.
    evidence: ["FMT-015", "FMT-007", "DSP-002"]
    scope: within-group

  - id: P6
    name: "Raw passthrough contract for JSON/JSONL export"
    description: |
      --json and --jsonl must output verbatim JSONL objects from the session
      transcript without any transformation. Filters and ranges select WHICH
      objects to include, but the objects themselves are not modified. The user
      explicitly corrected the agent multiple times on this (a40c:545, e583:1103).
    evidence: ["EXP-001", "EXP-002", "EXP-003"]
    scope: cross-group

  - id: P7
    name: "Sequence number stability"
    description: |
      Sequence numbers are assigned from the full timeline position and remain
      stable regardless of display mode, filtering, or range selection. The same
      event always has the same sequence number. This enables reliable cross-mode
      referencing and grep workflows.
    evidence: ["FMT-017", "DSP-004", "EXP-004"]
    scope: cross-group

  - id: P8
    name: "Blank line spacing in truncated/full modes"
    description: |
      Truncated and full modes use blank lines between message types for readability
      matching CC console appearance. Tool call and tool result are grouped together
      (no blank line between them). Compact mode has NO blank lines.
    evidence: ["FMT-023", "DSP-001", "DSP-002"]
    scope: within-group

  - id: P9
    name: "Discontinuous separator (grep-style --)"
    description: |
      When filtering creates gaps in the event sequence, a '--' separator line is
      inserted between non-contiguous groups. This applies to all display modes and
      follows the grep convention. It complements sequence numbers as a visual
      discontinuity indicator.
    evidence: ["FMT-018", "DSP-005"]
    scope: within-group

  - id: P10
    name: "No section headers in any mode"
    description: |
      Output contains no === TIMELINE ===, === CONVERSATION ===, or any other
      section headers. The user repeatedly corrected the agent to remove these.
      This applies to all display modes.
    evidence: ["FMT-024", "DSP-001", "DSP-002", "DSP-003"]
    scope: within-group

  - id: P11
    name: "Special user message types with distinct prefixes"
    description: |
      User messages have three special subtypes beyond plain '>' prefix:
      slash commands ('> /command is running...' in truncated, '> /command' in compact),
      local bash commands ('! command'), and file references ('@ filename').
      Each has a distinct prefix character to distinguish from regular user input.
    evidence: ["FMT-012", "FMT-013", "FMT-014", "FMT-001"]
    scope: within-group

  - id: P12
    name: "Filter-display separation"
    description: |
      Display modes control HOW events are rendered. Filters (include/exclude/range)
      control WHICH events are shown. The export modes (--json, --jsonl, --export-json)
      are alternative output formats that still respect the same filter pipeline.
      This separation is stated as an architecture principle (b475:1501-1600).
    evidence: ["DSP-001", "DSP-002", "DSP-003", "EXP-001", "EXP-002", "EXP-003"]
    scope: cross-group

constraints:
  - id: C1
    name: "No emojis in any output"
    description: |
      Output must use only Claude Code console symbols (⏺, ⎿, ✻, >, !, @, /,
      ☒, ◐, ☐). No emoji characters. User corrected this multiple times.
    evidence: ["FMT-025", "DSP-001", "DSP-002"]

  - id: C2
    name: "No interactive elements"
    description: |
      Output must not contain interactive-only elements like '(ctrl+r to expand)'
      or 'ctrl+r to see all'. These are noise in static log output.
    evidence: ["FMT-015", "DSP-002"]

  - id: C3
    name: "No section headers"
    description: |
      No === TIMELINE ===, === CONVERSATION ===, or similar section headers
      in any output mode. User repeatedly corrected this.
    evidence: ["FMT-024", "DSP-001", "DSP-002", "DSP-003"]

  - id: C4
    name: "Raw passthrough for JSON/JSONL"
    description: |
      --json and --jsonl must emit verbatim JSONL objects from the session
      transcript without modification. User explicitly corrected agent on this
      and reconfirmed it in a later session.
    evidence: ["EXP-001", "EXP-002"]

  - id: C5
    name: "Compact mode: exactly one line per event"
    description: |
      In compact mode, every event must fit on exactly one line. Multiline content
      is collapsed using first [...] last pattern. Newlines in tool parameters
      are replaced. No blank lines between events.
    evidence: ["DSP-001", "FMT-008"]

  - id: C6
    name: "Tool result indentation: 2 spaces + symbol + spaces"
    description: |
      Tool result lines use exactly 2 spaces before the ⎿ symbol. The agent
      struggled repeatedly with this spacing (3 spaces instead of 2, wrong number
      of spaces after ⎿). This must be precisely implemented.
    evidence: ["FMT-016", "FMT-007", "DSP-002"]

  - id: C7
    name: "Truncation count is TOTAL lines, not remaining"
    description: |
      In truncated mode, the '... +N lines' indicator shows the TOTAL line count
      of the tool result, not the number of remaining lines after the 3-line preview.
    evidence: ["FMT-015", "DSP-002"]

  - id: C8
    name: "Assistant text NOT truncated in truncated mode"
    description: |
      Only tool results are truncated (to 3 lines) in truncated mode. Assistant
      text messages are shown in full. The name 'truncated mode' refers to CC's
      truncation of tool output, not assistant text.
    evidence: ["FMT-015", "FMT-002", "DSP-002"]

  - id: C9
    name: "Display mode flags are mutually exclusive"
    description: |
      --truncated and --full are mutually exclusive. Default is compact mode.
      Only one display mode flag accepted at a time.
    evidence: ["DSP-003"]

  - id: C10
    name: "No arbitrary character truncation"
    description: |
      Tool commands and parameters must not be truncated to arbitrary character
      limits (e.g., no 60-char truncation). Show full first line of commands.
    evidence: ["FMT-003", "FMT-008", "DSP-002"]

tensions:
  - id: T1
    name: "Raw passthrough vs sequence numbers in export"
    description: |
      EXP-001 and EXP-002 require raw/verbatim JSONL objects (no modification).
      EXP-004 wants sequence numbers added to exported objects. Adding a sequence
      field would violate the raw passthrough contract. This is explicitly noted
      as unresolved in EXP-004 validation_notes.
    stories: ["EXP-001", "EXP-002", "EXP-004"]
    possible_resolution: |
      Wrap each raw object in an envelope {sequence: N, event: <raw_object>},
      or add sequence as a field that doesn't exist in the original (but this
      still modifies the object). Could also provide sequence via a separate
      output mode or flag. Needs user decision.

  - id: T2
    name: "Slash command prefix: > vs no prefix"
    description: |
      FMT-012 notes that at 0841:1257 the user says 'I dislike that you used >
      prefix also for these' about slash commands, but reconstruct.jq (the
      authoritative reference) uses > prefix for slash commands. The story
      currently specifies > prefix matching reconstruct.jq but flags the
      conflict for resolution.
    stories: ["FMT-012", "FMT-001"]
    possible_resolution: |
      Given that slash commands ARE user messages (user typed /command),
      the > prefix is semantically correct. The user may have been objecting
      to visual clutter. Could use a different prefix or no prefix for
      slash commands. This maps to CONF-004 in the conflicts directory.

  - id: T3
    name: "Sequence number visibility rules across modes"
    description: |
      FMT-017 and DSP-004 define complex rules: compact always shows [seq],
      truncated hides by default but auto-shows when filtering, --show-numbers
      overrides. But FMT-017 depends_on DSP-004 while DSP-004 depends_on
      DSP-001 and DSP-002, creating a circular logical dependency between
      formatting rules and display mode definitions.
    stories: ["FMT-017", "DSP-004", "DSP-001", "DSP-002"]
    possible_resolution: |
      Treat sequence number rendering as a cross-cutting concern that is
      configured per display mode, not as a dependency chain. The display
      mode determines default visibility, and --show-numbers is an override.

  - id: T4
    name: "FMT-018 and DSP-005 are near-duplicates"
    description: |
      FMT-018 (Discontinuous Section Separator in formatting epic) and
      DSP-005 (Discontinuous Section Separator in display epic) describe
      the same feature: '--' separator between non-contiguous events.
      FMT-018 depends_on DSP-005, suggesting the display epic owns the
      concept, but the formatting epic also has acceptance criteria for it.
    stories: ["FMT-018", "DSP-005"]
    possible_resolution: |
      Merge into a single story in the display epic (DSP-005), since the
      separator is a display-level concern. Remove or redirect FMT-018
      to be a reference/related story.

  - id: T5
    name: "FMT-017 and DSP-004 are near-duplicates"
    description: |
      FMT-017 (Sequence Number Display Logic in formatting epic) and
      DSP-004 (Sequence Number Display Control in display epic) cover
      the same feature with overlapping acceptance criteria. FMT-017 has
      6 ACs, DSP-004 has 7 ACs, with significant overlap.
    stories: ["FMT-017", "DSP-004"]
    possible_resolution: |
      Merge into a single story in the display epic (DSP-004), since
      sequence number visibility is a display-level concern. FMT-017
      should reference DSP-004 for the rules and focus only on the
      formatting details (bracket style, position in line).

  - id: T6
    name: "Export filters: same pipeline or separate?"
    description: |
      EXP-003 specifies that --export-json respects --include and --exclude
      filters with the same semantics as display filtering. But the export
      stories (EXP-001, EXP-002) don't explicitly state whether the filter
      pipeline is shared or separate. The filter-display separation principle
      implies a shared pipeline, but export is neither a filter nor a display mode.
    stories: ["EXP-001", "EXP-002", "EXP-003"]
    possible_resolution: |
      Clarify that the filter pipeline is shared across ALL output modes
      (display + export). The pipeline is: search -> range -> include ->
      exclude -> context. Then output mode (compact/truncated/full/json/jsonl/
      export-json) determines rendering. This aligns with PRIN-008.

  - id: T7
    name: "TodoWrite special handling scope"
    description: |
      FMT-020 defines special display for TodoWrite/TodoRead (custom labels,
      status symbols, priority codes). But established fact #5 says CC 2.x
      uses TaskCreate/TaskUpdate instead of TodoWrite. This means the TodoWrite
      formatting may only be relevant for 1.x sessions, while 2.x sessions
      need analogous handling for TaskCreate/TaskUpdate. FMT-010 covers Task
      tool but doesn't mention the Todo-like display with checkboxes.
    stories: ["FMT-020", "FMT-010"]
    possible_resolution: |
      Determine whether TaskCreate/TaskUpdate in 2.x serves the same purpose
      as TodoWrite in 1.x. If so, apply the same special display logic
      (status symbols, priority codes) to both. This connects to CONF-001
      (1.x vs 2.x format differences).

