cross_epic_concerns:
  - description: |
      CLI-001 (summary) must display inline hints referencing filter flags from the
      filtering epic (-U, -a, -T, -x, -i, -M). Any changes to filter flag names
      or semantics must be reflected in summary output.
    affects: ["filtering", "summary"]

  - description: |
      CLI-002 (timeline) and CLI-006 (implicit timeline) directly depend on display
      modes from the display-modes epic (DSP-001 compact, DSP-002 truncated,
      DSP-003 full). Timeline's default display is compact mode.
    affects: ["display-modes"]

  - description: |
      CLI-003 (--git) depends on FLT-005 glob pattern matching and the behavior of
      --include filter from the filtering epic. The glob pattern semantics (prefix
      vs substring vs wildcard) directly determine whether --git works for "cd dir &&
      git commit" style commands.
    affects: ["filtering"]

  - description: |
      CLI-006 (implicit timeline) must coexist with SRC-001 (search mode) without
      producing duplicate output. The search epic must participate in mode-resolution
      priority.
    affects: ["search"]

  - description: |
      CLI-007 (multi-index) depends on RNG-001 through RNG-004 from the range-selection
      epic for parsing +N, -N, N-M, N+ syntax and composing multiple ranges.
    affects: ["range-selection"]

  - description: |
      All CLI stories depend on PRS-005 (unified timeline data structure) from the
      jsonl-parsing epic. The unified timeline is the foundational data structure
      that all modes operate on.
    affects: ["jsonl-parsing"]

  - description: |
      The fetch epic (GFH-001 through GFH-010) is largely self-contained and operates
      independently of the local exploration epics. However, GFH-003 produces JSONL
      files that must be parseable by PRS-001 (load session). The output format of
      fetch is the input format of local exploration.
    affects: ["jsonl-parsing"]

  - description: |
      GFH-003 mentions session_id extraction which overlaps with PRS-001/PRS-002
      session identification. The fetch pipeline's session_id parsing must be
      consistent with the local exploration pipeline's expectations.
    affects: ["jsonl-parsing"]

established_fact_impacts:
  - fact: "Fact 6: MultiEdit and LS tools present in 1.x but absent from 2.x"
    affected_stories: ["CLI-004"]
    impact: |
      CLI-004-AC2 lists "Edit, Write, and MultiEdit operations" as file-modifying
      operations. In 2.x sessions, MultiEdit will not appear. The --files mode
      must handle both eras: 1.x includes MultiEdit, 2.x does not. The tool list
      for file-change detection should be version-aware or at minimum not fail
      when MultiEdit is absent.

  - fact: "Fact 3: Synthetic fixtures are unreliable"
    affected_stories: ["CLI-001", "CLI-005"]
    impact: |
      Both stories reference agent-proposed output formats (a40c:875 for summary,
      a40c:1197 for created). These are agent proposals, not verified golden files.
      Golden file assembly (Pass 3) must validate these formats against real session
      data, not synthetic fixtures. The acceptance criteria describe output format
      but lack verified golden file references.

  - fact: "Fact 9: Content format polymorphism (array vs string)"
    affected_stories: ["GFH-003"]
    impact: |
      GFH-003-AC5 scans first 10 lines for session_id. If content can be string
      or array, the session_id extraction logic in the fetch pipeline must handle
      both formats when parsing early JSONL lines. This is primarily a jsonl-parsing
      concern but affects fetch's session_id extraction step.

  - fact: "Fact 5: CC 2.x uses TaskCreate/TaskUpdate instead of TodoWrite"
    affected_stories: ["CLI-001"]
    impact: |
      Summary mode counts event types hierarchically. The tool breakdown must
      handle both TodoWrite (1.x) and TaskCreate/TaskUpdate (2.x) as distinct
      tool names. This affects the summary's tool count breakdown accuracy.

  - fact: "Fact 7: New 2.x event types (progress, stop_hook_summary, queue-operation)"
    affected_stories: ["CLI-001", "CLI-002"]
    impact: |
      Summary mode must count these new event types correctly. Timeline mode must
      display them in chronological order. Both modes need to handle event types
      that did not exist in 1.x without erroring.

  - fact: "Fact 8: New 2.x fields (agent_id, agent_transcript_path, todos, modelUsage)"
    affected_stories: ["CLI-001"]
    impact: |
      Summary mode may want to display agent-related information (e.g., multi-agent
      session indicator). New fields don't break anything but represent display
      opportunities for the summary view.
