group: 4
name: Interface/Infrastructure
epics: [cli, fetch]
story_count: 19
analyzed_at: 2026-02-27

patterns:
  - id: P1
    name: "Convenience aliases delegate to unified systems"
    description: |
      Multiple CLI stories establish that convenience shortcuts (--git, --files, --created)
      must NOT have separate implementations. They must delegate to the centralized
      filtering/timeline system. CLI-003 explicitly states --git must expand to
      --include with a glob pattern via the unified filter pipeline. CLI-004 is the
      exception: --files was reinstated BECAUSE it has a unique grouped-by-file display
      format that cannot be replicated by simple timeline filtering.
    evidence: ["CLI-003", "CLI-004", "CLI-006", "CLI-009"]
    scope: "cross-group"

  - id: P2
    name: "Implicit mode activation from context"
    description: |
      When no explicit mode flag is given, the tool infers the display mode from context:
      no args = summary mode (CLI-001); any filter or range = implicit timeline (CLI-006);
      --search = search mode overrides implicit timeline (CLI-006-AC4). This means the
      tool has a mode-resolution hierarchy: explicit mode > search > implicit timeline > summary.
    evidence: ["CLI-001", "CLI-002", "CLI-006"]
    scope: "cross-group"

  - id: P3
    name: "Orthogonality of filtering and display"
    description: |
      Filters (what to show) and display modes (how to show) are orthogonal concerns.
      CLI-002 explicitly states "filters are orthogonal to display mode" (AC3).
      CLI-006 sources cite "separate filtering (what to show) from display (how to show)".
      This is a foundational architectural principle that pervades the entire CLI design.
    evidence: ["CLI-002", "CLI-006", "CLI-003"]
    scope: "cross-group"

  - id: P4
    name: "Summary as self-documenting tutorial"
    description: |
      The summary mode (CLI-001) serves double duty: session overview AND inline CLI
      flag tutorial. Each count line includes a comment showing which flag produces that
      subset (e.g., "# -U", "# -a", "# -t"). This means summary is tightly coupled to
      the full CLI flag inventory -- any flag changes must be reflected in summary output.
    evidence: ["CLI-001"]
    scope: "cross-group"

  - id: P5
    name: "No section headers in output"
    description: |
      Output must never contain section headers like "=== TIMELINE ===" or
      "=== CONVERSATION ===". The user explicitly rejected these (CLI-008-AC5).
      The rationale is that the user knows what flags they sent.
    evidence: ["CLI-008"]
    scope: "cross-group"

  - id: P6
    name: "Unix tool conventions for CLI design"
    description: |
      The CLI is explicitly modeled after Unix tools (grep, rg, ls). Short flags for
      common operations, consistent argument ordering, session ID via short prefix
      (git-style), positional arguments after flags. CLI-008 sources cite the user
      saying "should build on your knowledge of conceptually related tools like grep, rg."
    evidence: ["CLI-008", "CLI-007"]
    scope: "within-group"

  - id: P7
    name: "Flat directory structure for fetched files"
    description: |
      All fetched session files must be in a single flat github/ directory. No
      subdirectories by type (issue vs PR), no per-run folders, no "unlinked" fallback
      folder. The user was extremely emphatic about this across multiple sessions
      (GFH-007 sources include profanity about unauthorized subfolder creation).
    evidence: ["GFH-007"]
    scope: "within-group"

  - id: P8
    name: "Filename as metadata carrier"
    description: |
      Fetched filenames encode all metadata: date, time, issue/PR type, number, run ID,
      session UUID. This enables deduplication (GFH-005 extracts run IDs from filenames),
      natural filesystem sorting (date-time prefix), and human identification without
      opening the file. The filename IS the index.
    evidence: ["GFH-007", "GFH-005", "GFH-004"]
    scope: "within-group"

  - id: P9
    name: "XML tags as authoritative metadata source"
    description: |
      Issue/PR classification uses XML tags in GHA logs (<is_pr>, <issue_number>,
      <pr_number>) exclusively. Title-based parsing was explicitly rejected as unreliable.
      The user stated XML tags are "ALWAYS present and always authoritative."
    evidence: ["GFH-004"]
    scope: "within-group"

  - id: P10
    name: "Performance-conscious extraction"
    description: |
      The fetch pipeline favors Unix tools (sed, awk) over Python for JSONL extraction.
      The user requested empirical benchmarking and the AWK-based approach won (~2-3ms).
      Fixed-position substring extraction (49-char prefix) is preferred over regex.
    evidence: ["GFH-003"]
    scope: "within-group"

  - id: P11
    name: "Dual-script parity"
    description: |
      fetch_logs.py and fetch_logs.sh must produce identical results for all operations.
      This includes identical output files, identical timestamps, and cross-script
      deduplication (files created by one are recognized by the other).
    evidence: ["GFH-010", "GFH-005", "GFH-006"]
    scope: "within-group"

constraints:
  - id: C1
    name: "Argument ordering: flags before session before ranges"
    description: |
      CLI flags must precede the positional session argument, and index/range arguments
      follow the session. Argparse breaks when flags appear after the session positional
      argument combined with +N range syntax. The correct order is:
      `xs -U -a -x Tool <session> +14`
    evidence: ["CLI-008", "CLI-007"]

  - id: C2
    name: "Short flag naming: uppercase for virtual entity shortcuts"
    description: |
      Virtual entity filter shortcuts use uppercase (-M, -U, -T) to avoid conflicts
      with grep/rg flag conventions. The lone exception is -a (lowercase). -S is
      --search, -s is --summary. These are hard constraints from flag collision avoidance.
    evidence: ["CLI-008"]

  - id: C3
    name: "Session identification via short prefix"
    description: |
      Sessions are identified by a 4-6 character GUID prefix (git-revision style).
      This is the primary positional argument to xs.
    evidence: ["CLI-008"]

  - id: C4
    name: "Range syntax vocabulary is fixed"
    description: |
      N = specific index, +N = first N (head), -N = last N (tail), N-M = range,
      N+ = from N onwards (open-ended). These are positional arguments after the
      session identifier. Multiple ranges are supported and merged without duplicates.
    evidence: ["CLI-007"]

  - id: C5
    name: "GFH extraction uses boundary markers, not content parsing"
    description: |
      JSONL extraction from GHA logs uses fixed boundary markers:
      Start = "Running Claude with prompt from file:"
      End = "Log saved to" + "claude-execution-output.json"
      The log prefix is exactly 49 characters and is stripped by fixed-position
      substring, not regex.
    evidence: ["GFH-003"]

  - id: C6
    name: "Session ID from first 10 lines, not just line 1"
    description: |
      When extracting session_id from JSONL content, scan the first 10 lines
      (not just line 1) because the session_id field may not appear on the
      first line. This was a specific bug fix.
    evidence: ["GFH-003"]

  - id: C7
    name: "Timestamp semantics: ctime = start, mtime = end"
    description: |
      File creation time = session start timestamp, modification time = session end
      timestamp. On macOS, creation time requires SetFile command (os.utime cannot
      set it). Access time must NOT be used (user was emphatic about this).
    evidence: ["GFH-006"]

  - id: C8
    name: "Filename timestamp from workflow createdAt, not session start"
    description: |
      The date-time prefix in filenames comes from the workflow's createdAt field,
      not the session start timestamp. These are subtly different (workflow creation
      vs actual session start).
    evidence: ["GFH-007"]

  - id: C9
    name: "No 'unlinked' fallback category"
    description: |
      If XML metadata tags are missing from a log, the file gets no issue/PR
      classification. There is no 'unlinked' folder or category. The user
      explicitly rejected this fallback.
    evidence: ["GFH-004", "GFH-007"]

  - id: C10
    name: "--conversation flag must not exist"
    description: |
      The --conversation flag was intentionally removed. The xs recreation must
      NOT include it. Equivalent behavior is achieved by combining -U -a -x Tool
      or using -M (message filter).
    evidence: ["CLI-009"]

tensions:
  - id: T1
    name: "Convenience alias with unique display vs delegation pattern"
    description: |
      CLI-003 (--git) and CLI-009 (--conversation removal) establish that convenience
      aliases should delegate to the unified filter system. But CLI-004 (--files) was
      explicitly reinstated BECAUSE it has a unique grouped-by-file display format.
      This creates a tension: when does a shortcut deserve its own display mode vs
      being a pure filter alias? The distinguishing factor seems to be whether the
      shortcut produces a fundamentally different OUTPUT FORMAT (--files groups by file)
      vs just different CONTENT SELECTION (--git selects git commands).
    stories: ["CLI-003", "CLI-004", "CLI-009"]
    possible_resolution: |
      Formalize the rule: shortcuts that only change content selection delegate to
      filter pipeline; shortcuts that produce a unique display format get their own
      mode. --files and --created are display modes; --git is a filter alias.

  - id: T2
    name: "Implicit timeline vs explicit search mode priority"
    description: |
      CLI-006 establishes that filters/ranges trigger implicit timeline mode. But
      CLI-006-AC4 carves out an exception: --search overrides implicit timeline.
      This means there's a hidden mode-resolution precedence that must be carefully
      implemented. What happens with other explicit modes (--files, --created, --summary)
      combined with filters? Do they also override implicit timeline?
    stories: ["CLI-006", "CLI-001", "CLI-002"]
    possible_resolution: |
      Establish explicit precedence: explicit mode flags (--summary, --files, --created,
      --search) always win over implicit timeline. Implicit timeline only activates
      when NO explicit mode flag is present and filters/ranges are given.

  - id: T3
    name: "--git glob pattern matching depth"
    description: |
      CLI-003-AC3 requires --git to match git operations anywhere in the command string
      (e.g., "cd myproject && git commit"). But the glob pattern "Bash(git *)" only
      matches prefix. This is actually a tension with the filtering epic's glob matching
      implementation (FLT-005): how sophisticated does glob matching need to be?
      Should it support substring matching, or must the user write "Bash(*git *)"?
    stories: ["CLI-003"]
    possible_resolution: |
      The --git shortcut needs a more permissive pattern like "Bash(*git*)" or the
      glob matcher needs to support contains-style matching. This affects FLT-005
      glob pattern semantics.

  - id: T4
    name: "Fetch pipeline: Python vs shell as primary"
    description: |
      GFH-010 requires parity between fetch_logs.py and fetch_logs.sh. But GFH-003
      favors Unix tools (AWK) for performance, and f9c7:1301 states "rewriting
      fetch_logs.py to bash script." Is the intent to eventually deprecate Python
      in favor of shell? Or maintain both indefinitely? Maintaining parity is
      expensive and error-prone.
    stories: ["GFH-010", "GFH-003"]
    possible_resolution: |
      For the xs recreation, decide: single implementation (Python with subprocess
      calls to awk/sed for hot paths) or dual scripts. User's parity requirement
      suggests both are valued, but the maintenance burden may argue for consolidation.

  - id: T5
    name: "Filename timestamp source ambiguity"
    description: |
      GFH-007-AC2 says filename timestamp comes from workflow createdAt. But
      GFH-007 source f9c7:1401 also says "extract from raw log as additional
      metadata so that it is truly matching the time." These could differ slightly.
      GFH-006 uses session start/end timestamps for file creation/modification time.
      So we have THREE timestamp concepts: workflow createdAt (filename), session
      start (file ctime), session end (file mtime). The distinction is subtle and
      the sources show the user deliberating about which to use where.
    stories: ["GFH-007", "GFH-006"]
    possible_resolution: |
      Clarify the three-timestamp model: workflow createdAt for filename prefix
      (human-readable, approximate); session start for file ctime (precise start);
      session end for file mtime (precise end). All three are independent.

