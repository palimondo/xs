## Summary

The context recovery epic covers the automated detection of compaction events
and the orchestrated recovery of lost context using xs as the primary data
access tool. The two-hook architecture (PreCompact creates flag, PreToolUse
detects flag and blocks tool use with recovery prompt) was developed iteratively
across sessions e583 and 760a, with multiple API format explorations before
settling on permissionDecision/permissionDecisionReason.

