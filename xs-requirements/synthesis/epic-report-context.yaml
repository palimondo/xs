## New Stories Proposed

new_stories: none
rationale: |
  The existing 7 stories adequately cover the compaction recovery workflow.
  The isCompactSummary JSONL field detection belongs in PRS (parsing) epic.
  The hook design principle (hard constraints vs soft preferences from day-018)
  is a cross-cutting concern better captured as a principle than a story.

## Open Questions

  - The --jq and --tail flags (e583:1601-1700) are requested features that may
    not exist in the current implementation. Their absence creates a gap in the
    compaction recovery workflow (cannot get "last compaction event").
  - The pipeline ordering issue (tail before search vs after) needs resolution
    in the filtering/range-selection epics before CRH-005 AC1 can be fully met.
  - Hook format correctness (permissionDecision vs decision/block) was resolved
    in e583 but the 400 errors in 760a suggest the fix may not have been tested
    successfully in a single session.

## Confidence Assessment

confidence: high
notes: |
