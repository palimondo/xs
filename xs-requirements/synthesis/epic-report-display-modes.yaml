stories_populated:
  - id: DSP-001
    title: Compact display mode (one line per event)
    status: mined
    sources_count: 16
    acceptance_criteria_count: 8
    key_findings: |
      Compact mode is the default. Each event on exactly one line.
      Format: [seq] + same Tool(param) symbols as truncated mode.
      Multiline content uses first_line [...] last_line pattern.
      No emojis, no section headers. Derives from truncated mode format.

  - id: DSP-002
    title: Truncated display mode (console-like)
    status: mined
    sources_count: 22
    acceptance_criteria_count: 10
    key_findings: |
      Core fidelity requirement: replicate CC console output using reconstruct.jq as reference.
      Symbols: > (user), ⏺ (assistant/tool), ⎿ (tool results), ✻ (thinking).
      Tool results truncated to 3 lines + "... +N lines" (N = total count, not remaining).
      No (ctrl+r to expand) — user explicitly reversed this decision.
      No sequence numbers by default. No section headers. No emojis.
      Assistant text messages shown in full (only tool results truncated).

  - id: DSP-003
    title: Full display mode (no truncation)
    status: mined
    sources_count: 10
    acceptance_criteria_count: 7
    key_findings: |
      Full mode = truncated mode without truncation. Same symbols and spacing.
      Equivalent to pressing ctrl+r in CC console (expanded view).
      --full and --truncated are mutually exclusive flags.
      Rich-text formatting with markdown preserved.

  - id: DSP-004
    title: Sequence number display control
    status: mined
    sources_count: 10
    acceptance_criteria_count: 7
    key_findings: |
      Compact mode: always shows [seq] prefix.
      Truncated/full mode: no sequence numbers by default.
      --show-numbers flag forces sequence numbers in truncated/full modes.
      Numbers must be stable (assigned from timeline position, unaffected by filters).

  - id: DSP-005
    title: Show separator between non-contiguous sections
    status: mined
    sources_count: 2
    acceptance_criteria_count: 4
    key_findings: |
      Grep-style "--" separator between non-contiguous event groups.
      Triggered by filtering or context windows (-A/-B/-C) creating gaps.
      Confirmed working in session 1e83 with filtered compact output.

