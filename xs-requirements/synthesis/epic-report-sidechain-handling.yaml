# Epic Synthesis Report: Sidechain Handling

epic: sidechain-handling
synthesized_by: opus
timestamp: 2026-02-17T22:00:00Z

summary: |
  The sidechain-handling epic covers how xs treats events from Task sub-agent
  sessions (marked with isSidechain=true in the raw JSONL). The primary source
  of findings is session e583, which contains an extended investigation into
  sidechain event visibility that went through three phases: initial incorrect
  conclusion that sub-agent actions are invisible, discovery that xs --jsonl
  strips metadata, and final resolution confirming sidechain events DO appear
  in timeline output as regular events.

stories_populated:
  - id: SID-001
    title: Display sidechain events in timeline
    status: mined
    sources_count: 7
    acceptance_criteria_count: 4
    key_insight: |
      Sidechain events ARE displayed in xs timeline as regular events without
      special marking. This was confirmed by characterization test after
      extensive investigation. Summary counts include sidechain actions.

  - id: SID-002
    title: Search includes sidechain content
    status: mined
    sources_count: 4
    acceptance_criteria_count: 2
    key_insight: |
      Search finds content within sidechain events (confirmed by test). However,
      a search crash (AttributeError on list content) was discovered during
      sidechain investigation. The crash is a general search robustness bug,
      not sidechain-specific, but it blocks reliable sidechain content search.

  - id: SID-003
    title: Filter sidechain events with dedicated flag
    status: mined
    sources_count: 3
    acceptance_criteria_count: 3
    key_insight: |
      No explicit user request for a sidechain filter flag exists. The most
      concrete finding is that xs --jsonl strips isSidechain metadata, while
      user explicitly requires raw JSONL passthrough. AC3 (metadata preservation)
      has the strongest source backing. AC1/AC2 (include/exclude flags) are
      speculative future features.

