    key_decision: "Simple substring match (case-insensitive), NOT regex, NOT rg delegation. Short form is -S."

  - id: SRC-002
    title: Show lines after match (-A)
    status: mined
    sources_count: 5
    acceptance_criteria_count: 3
    key_decision: "Uppercase -A NUM (grep convention). Context expansion is pipeline step 4."

  - id: SRC-003
    title: Show lines before match (-B)
    status: mined
    sources_count: 5
    acceptance_criteria_count: 3
    key_decision: "Uppercase -B NUM (grep convention). Confirmed working with range: --search 'interrupted' -B 2 120-150."

  - id: SRC-004
    title: Show lines before and after match (-C)
    status: mined
    sources_count: 4
    acceptance_criteria_count: 4
    key_decision: "-C NUM equivalent to -A NUM -B NUM. Overlapping context windows must be merged."

  - id: SRC-005
    title: Search results and display mode interaction
    status: mined
    sources_count: 5
    acceptance_criteria_count: 6
    key_decision: "Search must suppress implicit timeline to avoid duplicate output. Must work with --full."

new:
  - id: SRC-006
    title: Visual separators between non-contiguous results
    status: mined
    sources_count: 3
    acceptance_criteria_count: 4
    justification: "Multiple findings document the need for -- separators between non-contiguous search/filter result sections. Follows grep/rg convention. Agent self-identified the visual gap issue (caf2:1101-1199) and a separate session explicitly references -- separator for discontinuous sections (1e83:601-700)."

  - id: SRC-007
    title: Search position in filter pipeline
    status: mined
    sources_count: 6
    acceptance_criteria_count: 4
    justification: "The 5-step filter pipeline ordering (search -> range -> include -> exclude -> context) was stated by the user TWICE in separate sessions (caf2:301-400 and caf2:901-1000). A bug was found where search ignored -i/-x filters (caf2:1001-1100). A known gap exists where tail-of-search-results is not expressible. This interaction model is fundamental to the search epic and warrants its own story."

## Key Design Decisions Found

decisions:
  - id: DEC-SRC-001
    topic: "Search is simple substring, not regex/rg"
    resolution: "Simple case-insensitive substring match"
    sources: ["caf2:801-900 F001", "caf2:701-800 F007"]
    confidence: high
    notes: "User asked about rg delegation. Agent confirmed it is NOT rg. Help text says 'simple substring match'."

  - id: DEC-SRC-002
    topic: "Short form for --search"
    resolution: "-S (not -E as initially proposed)"
    sources: ["caf2:701-800 F005", "caf2:801-900 F001", "e583:901-1000 F001"]
    confidence: high
    notes: "User proposed -E (grep convention for regex). Resolved as -S. No short form conflict since -s is --summary."

  - id: DEC-SRC-003
    topic: "Context flags are uppercase -A/-B/-C"
    resolution: "Uppercase (grep/rg convention). Lowercase -a reserved for assistant filter."
    sources: ["caf2:301-400 F005"]
    confidence: high
    notes: "User explicitly stated: 'grep/rg parameters are capital A, B, C, so we are free to use -a as shortcut for -i Assistant'."

  - id: DEC-SRC-004
    topic: "Filter pipeline ordering"
    resolution: "search -> range -> include -> exclude -> context expansion"
    sources: ["caf2:301-400 F004", "caf2:901-1000 F001"]
    confidence: high
    notes: "Stated twice by user. Implementation bugs found when ordering was wrong."

  - id: DEC-SRC-005
    topic: "Gap separator style"
    resolution: "-- (double dash, grep/rg convention)"
    sources: ["1e83:601-700 F005", "caf2:1101-1199 F001"]
    confidence: medium
    notes: "Agent-initiated decision, not explicitly user-approved. Follows grep convention."

