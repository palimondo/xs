group: 1
name: Core Pipeline
epics: [parsing, filtering, range]
story_count: 35
analyzed_at: 2026-02-27

patterns:
  - id: P1
    name: "Timeline is the central data structure"
    description: |
      The unified chronological timeline (PRS-005) is the foundation that both
      filtering and range selection operate on. Every story in filtering and range
      depends on PRS-005. The timeline assigns contiguous sequence numbers starting
      from 1 to ALL events (no gaps, no skips), and these numbers are stable
      regardless of active filters or display modes.
    evidence: ["PRS-005", "FLT-001", "FLT-002", "FLT-003", "FLT-004", "FLT-011",
               "FLT-015", "RNG-001", "RNG-002", "RNG-003", "RNG-004", "RNG-005",
               "RNG-006", "RNG-007"]
    scope: "cross-group"

  - id: P2
    name: "Canonical pipeline ordering: search -> range -> include -> exclude -> context"
    description: |
      The user explicitly defined the filter pipeline ordering twice in separate
      sessions (FLT-011, RNG-007). The order is:
      0. Search by pattern (-e/--search)
      1. Select by range (positional args)
      2. Include whitelist (--include/-i)
      3. Exclude blacklist (--exclude/-x)
      4. Context expansion (-A/-B/-C) with dedup
      This pipeline is applied once at the event array level, not reimplemented
      per output mode. Range applies to the FULL unfiltered timeline first, then
      include/exclude filters narrow the result.
    evidence: ["FLT-011", "RNG-007", "RNG-002", "RNG-003", "FLT-002"]
    scope: "cross-group"

  - id: P3
    name: "Include/exclude duality with symmetric syntax"
    description: |
      The user explicitly required --include and --exclude to have identical
      comma-separated syntax. Include acts as a whitelist; exclude further removes
      from what was included. Both accept tool names, parameterized tool names
      with glob patterns (Tool(glob)), and virtual entity names (Message, Tool,
      User, Assistant, Thinking).
    evidence: ["FLT-001", "FLT-002", "FLT-005", "FLT-011"]
    scope: "within-group"

  - id: P4
    name: "Virtual entities as a unifying filter abstraction"
    description: |
      Virtual entities (Message, Tool, User, Assistant, Thinking) provide coarse
      filtering categories that replace ad-hoc special flags. They unify the
      filter syntax: --include Message replaces deprecated --conversation,
      --include Tool replaces old tool-specific flags. Virtual entities take no
      parameters; parameters are for specific tool names (Bash(git *)).
    evidence: ["FLT-003", "FLT-004", "FLT-013", "FLT-006", "FLT-007", "FLT-008",
               "FLT-009"]
    scope: "within-group"

  - id: P5
    name: "Content block as atomic timeline unit"
    description: |
      Within a JSONL message, content is an array of typed blocks (text, tool_use,
      tool_result, thinking). Each block becomes a separate timeline entry with its
      own sequence number. This is the level at which filtering operates. An
      assistant message with both text and tool_use blocks expands into multiple
      timeline entries.
    evidence: ["PRS-013", "PRS-005"]
    scope: "cross-group"

  - id: P6
    name: "Content format polymorphism requires dual handling"
    description: |
      User message content can be either an array of typed blocks (tool_result) or
      a plain string (regular text input). The parser must handle both forms.
      Assistant messages always have content as an array. This polymorphism is a
      fundamental parsing concern that affects every downstream consumer.
    evidence: ["PRS-013", "PRS-005"]
    scope: "cross-group"

  - id: P7
    name: "Glob pattern matching from Claude Code allowed-tools"
    description: |
      Filter patterns use fnmatch glob syntax (*, **, ?), NOT regex. This syntax
      is derived from Claude Code's allowed-tools permission system. Different
      tool types match against different parameters: Edit/Write/MultiEdit match
      against file_path, Bash matches against command. The user explicitly
      corrected the agent when regex was proposed.
    evidence: ["FLT-005", "FLT-001"]
    scope: "within-group"

  - id: P8
    name: "Implicit timeline mode from filter/range presence"
    description: |
      When any filter flag (--include, --exclude, -M, -U, -a, -T) or range
      argument is present, timeline display mode is implied automatically. No
      explicit -t flag is needed. Summary mode is the default only when no
      filters or ranges are specified.
    evidence: ["FLT-011", "FLT-006", "FLT-007", "FLT-008", "FLT-009"]
    scope: "cross-group"

  - id: P9
    name: "Filter-display separation"
    description: |
      Filtering (what to show) and display (how to show) are orthogonal concerns.
      Filters compose into a pipeline applied at the event array level. Display
      modes (compact, truncated, full, JSON, JSONL) render the filtered result.
      However, FLT-012 reveals a boundary leak: -x Tool must suppress tool
      announcements that are generated at display time, requiring exclude filters
      to be passed to the display function.
    evidence: ["FLT-011", "FLT-012", "FLT-015"]
    scope: "cross-group"

  - id: P10
    name: "Raw JSONL preservation alongside structured timeline"
    description: |
      The parser must retain the original raw JSONL objects verbatim alongside
      the parsed/structured timeline. This enables --json/--jsonl export modes
      to output unmodified source data. Filters and ranges select which events
      to include, but the JSON content is never transformed.
    evidence: ["PRS-012"]
    scope: "cross-group"

  - id: P11
    name: "Multi-line JSON accumulation parser"
    description: |
      Claude Code session files use pretty-printed (multi-line) JSON, not
      standard one-object-per-line JSONL. The parser must accumulate lines until
      a complete JSON object boundary is found. Naive line-by-line JSON.loads()
      breaks. This is a hard technical constraint for the parsing layer.
    evidence: ["PRS-003", "PRS-001"]
    scope: "within-group"

  - id: P12
    name: "Shortcut flags follow grep/rg convention"
    description: |
      Single-letter shortcuts for virtual entity filters are deliberately chosen
      to avoid conflict with grep/rg conventions. Uppercase -A/-B/-C are reserved
      for grep-style context lines. Lowercase -a is used for Assistant (because
      -A is taken). Uppercase -M for Message, -U for User, -T for Tool.
    evidence: ["FLT-006", "FLT-007", "FLT-008", "FLT-009"]
    scope: "cross-group"

  - id: P13
    name: "Tool use and tool result are paired timeline events"
    description: |
      A tool invocation produces two separate timeline events: tool_use (from
      assistant message) and tool_result (from user message with tool_result
      content). When filtering by tool name, BOTH the tool_use and its
      corresponding tool_result must be included or excluded together. The
      --no-tool-results flag suppresses tool_result events specifically.
    evidence: ["FLT-001", "FLT-010", "PRS-005", "PRS-013"]
    scope: "cross-group"

  - id: P14
    name: "Range syntax disambiguation"
    description: |
      Range syntax was carefully designed to avoid ambiguity:
      - N (bare positive integer) = single item at index N
      - +N (plus prefix) = first N items (head)
      - -N (minus prefix) = last N items (tail)
      - N-M (dash between) = contiguous range
      - N+ (plus suffix) or N- (dash suffix) = from N to end
      The user explicitly resolved the +N vs bare N ambiguity.
    evidence: ["RNG-001", "RNG-002", "RNG-003", "RNG-004", "RNG-005"]
    scope: "within-group"

constraints:
  - id: C1
    name: "Full backwards/forwards format compatibility"
    description: |
      The parser must handle both Claude Code 1.x and 2.x format sessions.
      The user explicitly stated "full backwards/forwards compatibility."
      Version detection uses the version field in system events, with structural
      inference as fallback.
    evidence: ["PRS-006"]

  - id: C2
    name: "Gapless contiguous sequence numbers"
    description: |
      Timeline sequence numbers must be contiguous starting from 1, with no gaps.
      Even empty messages (assistant with no text/tools) receive a sequence number.
      The user reported a bug when item [13] was missing from range 12-14. This is
      a hard invariant.
    evidence: ["PRS-005", "RNG-004"]

  - id: C3
    name: "No implicit filtering without explicit flags"
    description: |
      Without --include or --exclude flags, the timeline MUST show ALL events
      including thinking content, meta messages, and empty messages. The user
      called implicit filtering "a serious issue." This is a zero-tolerance
      constraint.
    evidence: ["FLT-015", "PRS-005"]

  - id: C4
    name: "Raw passthrough for JSON/JSONL export"
    description: |
      --json and --jsonl export modes must output the original JSONL objects
      verbatim, with only range/filter selection applied. The user explicitly
      corrected the agent when transformed data with null fields was output.
    evidence: ["PRS-012"]

  - id: C5
    name: "SIGPIPE graceful handling"
    description: |
      When xs output is piped to head/tail and the pipe closes early, xs must
      exit gracefully without a Python traceback.
    evidence: ["PRS-004"]

  - id: C6
    name: "Parsing efficiency for large files"
    description: |
      JSONL session files can be 500KB+ (GitHub Actions). An early naive parser
      timed out at 2 minutes on a 500KB file. The parser must handle large files
      without excessive memory or time.
    evidence: ["PRS-001", "PRS-003"]

  - id: C7
    name: "Glob syntax, not regex"
    description: |
      Tool filter patterns use fnmatch glob semantics (*, **, ?), NOT regex.
      The user explicitly corrected the agent: "not explicit regex syntax, what
      the allowed-tools do." This adopts Claude Code's allowed-tools permission
      syntax.
    evidence: ["FLT-005"]

  - id: C8
    name: "No duplicate events in output"
    description: |
      Context expansion (-A/-B/-C) can produce overlapping ranges. The output
      must never contain duplicate events or events out of order. The user called
      duplicate output "a serious bug that must be fixed immediately."
    evidence: ["FLT-011"]

  - id: C9
    name: "Centralized range/filter at event array level"
    description: |
      Range selection and filtering logic must be implemented once, centrally,
      at the event array level. It must NOT be reimplemented per output mode
      or sub-command. The user explicitly asked "why isn't the range-ing
      implemented once for all output styles?"
    evidence: ["RNG-007", "FLT-011"]

  - id: C10
    name: "Timestamp-based ranges explicitly out of scope"
    description: |
      Time-based range selection was discussed and explicitly deferred. Only
      index-based range selection is in scope.
    evidence: ["RNG-007"]

tensions:
  - id: T1
    name: "Range-before-filter prevents 'last N search results'"
    description: |
      The canonical pipeline applies range BEFORE include/exclude filters.
      This means -N (tail) selects the last N items from the full timeline,
      not the last N filtered results. The user identified this gap and proposed
      a separate --tail flag for post-filter tail selection, but it was never
      resolved. This creates a tension between stable addressing (ranges use
      absolute indices) and the common use case of "show me the last 5 matching
      items."
    stories: ["RNG-003", "RNG-007", "FLT-011"]
    possible_resolution: |
      Add a --tail N post-filter flag that operates after include/exclude,
      distinct from -N range syntax. The user proposed this in e583:1601-1700
      but cautioned about creating "conflicting mess of exclusive parameter sets."

  - id: T2
    name: "Filter-display boundary leak for tool announcements"
    description: |
      FLT-012 reveals that -x Tool must suppress [Tools: Bash] announcement
      lines that are generated at display time, not filter time. This violates
      the clean filter-display separation principle (P9). The exclude filters
      must be passed to the display function to suppress these announcements.
    stories: ["FLT-012", "FLT-011", "FLT-015"]
    possible_resolution: |
      The display layer must be aware of active exclude filters for tool
      announcements. This is a controlled boundary crossing, not a full
      violation of filter-display separation. The display function receives
      exclude_filters as a parameter.

  - id: T3
    name: "Thinking blocks: are they in JSONL?"
    description: |
      FLT-013 (Thinking virtual entity) has an unresolved question: the agent
      believed thinking/reasoning blocks might be UI-only and not present in
      JSONL data. However, PRS-005 and PRS-013 state that thinking content
      blocks ARE in JSONL and must be parsed and included in the timeline.
      The established facts (item 9) confirm content blocks include thinking type.
    stories: ["FLT-013", "PRS-005", "PRS-013"]
    possible_resolution: |
      Established fact 9 (content format polymorphism) and PRS-013/PRS-005
      confirm thinking blocks exist in JSONL. FLT-013's validation_notes
      caveat ("Needs format investigation") is likely outdated. Thinking blocks
      are present in assistant message content arrays.

  - id: T4
    name: "--git shortcut fails with cd-prefixed commands"
    description: |
      FLT-014's --git shortcut uses Bash(git *) pattern which only matches
      commands starting with "git ". Real sessions often have commands like
      "cd myproject && git commit" which don't match. This is a known
      limitation documented in the story (CONF-003).
    stories: ["FLT-014", "FLT-005"]
    possible_resolution: |
      Use Bash(*git*) pattern (match git anywhere in command) or implement
      a smarter matching strategy that accounts for cd prefixes and && chains.
      Tradeoff: broader match may catch false positives.

  - id: T5
    name: "Sequence numbers in JSON/JSONL export"
    description: |
      PRS-012 notes that the user expected sequence/index numbers to be included
      when exporting events as JSON/JSONL, but raw passthrough means the original
      JSONL objects don't contain sequence numbers. This creates a tension between
      the raw passthrough contract and the desire for event addressing in exports.
    stories: ["PRS-012"]
    possible_resolution: |
      Either inject a sequence number field into exported objects (violating raw
      passthrough) or make sequence number derivable from position in output.
      The user raised this but it was "not fully resolved" per validation notes.

  - id: T6
    name: "+N vs N+ syntactic similarity"
    description: |
      +N (first N items, head) and N+ (from N onwards) are syntactically very
      similar but semantically different. +5 means "first 5 items" while 5+
      means "from item 5 to end." The user noted difficulty naming the N+
      syntax and questioned discoverability.
    stories: ["RNG-002", "RNG-005"]
    possible_resolution: |
      Accept both forms as the user ultimately approved them. Clear help text
      and examples are essential. The user kept the syntax despite hesitation.

  - id: T7
    name: "MCP tool naming pattern needs parametric filter"
    description: |
      MCP tools use naming pattern mcp__server__tool. Filtering these requires
      parameterized tool filters like Tool(mcp__*). This is handled by FLT-005
      glob patterns, but the "Tool" virtual entity (FLT-004) takes no parameters.
      To filter MCP tools specifically, you must use the parameterized form, not
      the virtual entity.
    stories: ["FLT-004", "FLT-005", "PRS-013"]
    possible_resolution: |
      This is by design. Virtual entities are coarse (Tool = all tools);
      parameterized forms (Tool(mcp__*)) are for fine-grained filtering.
      Documentation should clarify this distinction.

