cross_epic_concerns:
  - description: |
      The timeline (PRS-005) is the shared contract between parsing, filtering,
      range, display, export, search, and summary. Any change to how timeline
      entries are structured affects all downstream consumers.
    affects: ["display-modes", "export", "search", "summary", "console-formatting"]

  - description: |
      Content block extraction (PRS-013) determines what types of content are
      available for filtering. Thinking blocks, tool_use, tool_result, and text
      blocks all need distinct type classification for virtual entity filtering
      to work correctly.
    affects: ["display-modes", "console-formatting"]

  - description: |
      Format version detection (PRS-006) affects console-formatting: tool renames
      between 1.x and 2.x (LS Tool -> LS, View -> Read) and potential display
      format differences between versions (CONF-001).
    affects: ["console-formatting", "CONF-001"]

  - description: |
      The raw JSONL preservation requirement (PRS-012) creates a constraint on
      the export epic: --json/--jsonl must output unmodified source objects.
      The tension about sequence numbers in exports (T5) affects the export epic.
    affects: ["export", "CONF-002"]

  - description: |
      Filter shortcuts (-M, -U, -a, -T) imply timeline mode automatically (P8).
      This affects CLI interface design: the cli-interface epic must handle the
      implicit mode switching when filter flags are present.
    affects: ["cli-interface"]

  - description: |
      The pipeline ordering (search -> range -> include -> exclude -> context)
      directly constrains the search epic: search results must feed into the
      same filter pipeline. Context expansion (-A/-B/-C) with dedup is a
      cross-cutting concern affecting both filtering and search.
    affects: ["search"]

  - description: |
      Agent file discovery (PRS-011) and sidechain handling are parsing-level
      concerns that affect the sidechain-handling epic. Agent files use the same
      JSONL format but are separate files that need discovery.
    affects: ["sidechain-handling"]

  - description: |
      Fuzzy session discovery (PRS-002) with its interactive disambiguation menu
      affects the CLI interface epic. The fallback to ~/.claude/projects/ directory
      search is a CLI-level concern.
    affects: ["cli-interface"]

  - description: |
      The --no-tool-results flag (FLT-010) suppresses tool_result events. This
      interacts with display modes: in truncated mode, tool results are shown
      indented under tool_use; suppressing them changes the display layout.
    affects: ["console-formatting", "display-modes"]

  - description: |
      Interruption detection (PRS-009) and meta/caveat tracking (PRS-010) produce
      specially classified events that need distinct formatting in the
      console-formatting epic (e.g., "Interrupted by user" display, [META] prefix).
    affects: ["console-formatting", "summary"]

established_fact_impacts:
  - fact: "Fact 9: Content format polymorphism - message.content can be array (24478) or string (1944)"
    affected_stories: ["PRS-013", "PRS-005"]
    impact: |
      PRS-013-AC5 explicitly handles the string case. PRS-005 implicitly depends
      on this being handled correctly. The ratio (24478 array vs 1944 string)
      confirms this is not an edge case -- ~7% of content fields are strings.
      Both forms must be first-class in the parser.

  - fact: "Fact 10: tool_result content can be string (7658) or array (38)"
    affected_stories: ["PRS-013", "PRS-009"]
    impact: |
      PRS-013-AC4 handles tool_result content extraction but does not explicitly
      mention the string vs array polymorphism for tool_result content specifically.
      The overwhelmingly common case is string (7658 vs 38 array), but both must
      be handled. Interruption detection (PRS-009) may need to check both forms
      when looking for "[Request interrupted by user" content.

  - fact: "Fact 4: CC 1.x never sends parallel tool calls (always 1 tool_use per assistant message)"
    affected_stories: ["PRS-013", "PRS-005"]
    impact: |
      PRS-013-AC6 states "each block becomes a separate timeline entry preserving
      order" -- this applies differently in 1.x (always 1 tool_use) vs 2.x
      (potentially multiple tool_use blocks in one message). Timeline building
      (PRS-005) must handle both cases. In 1.x, assistant messages expand to at
      most 2 timeline entries (text + tool_use). In 2.x, they can expand to many.

  - fact: "Fact 5: CC 2.x uses TaskCreate/TaskUpdate instead of TodoWrite"
    affected_stories: ["FLT-001", "FLT-005"]
    impact: |
      Filter patterns referencing specific tool names must account for version
      differences. TodoWrite filters work on 1.x sessions but not 2.x (where
      TaskCreate/TaskUpdate are used). This reinforces the need for version-aware
      tool name knowledge, or at minimum, clear documentation that tool names
      in filters match against what appears in the JSONL.

  - fact: "Fact 6: MultiEdit and LS tools present in 1.x but absent from 2.x"
    affected_stories: ["FLT-005"]
    impact: |
      FLT-005-AC7 specifically mentions MultiEdit matching against file_path.
      This tool only exists in 1.x sessions. Filter patterns using MultiEdit
      will simply match nothing in 2.x sessions -- this is correct behavior
      but worth noting for documentation.

  - fact: "Fact 7: New 2.x event types: progress (hook_progress), stop_hook_summary, queue-operation"
    affected_stories: ["PRS-005", "FLT-015"]
    impact: |
      PRS-005 defines timeline building for known event types (system, assistant,
      user). New 2.x event types need timeline entry classification. FLT-015's
      requirement that "no implicit filtering occurs" means these new event types
      must appear in the unfiltered timeline even if they have no dedicated display
      format yet.

  - fact: "Fact 8: New 2.x fields: agent_id, agent_transcript_path, todos, modelUsage"
    affected_stories: ["PRS-011", "PRS-005"]
    impact: |
      PRS-011 (agent file loading) uses agent_transcript_path for discovery.
      PRS-005 timeline building may need to incorporate agent_id for sidechain
      event identification. These fields should be preserved in the parsed
      representation even if not immediately used.

  - fact: "Fact 1: 'Bash: $ command' format was an xs bug, NOT real CC 1.x console format"
    affected_stories: []
    impact: |
      No parsing or filtering stories reference this buggy format. This is a
      display/formatting concern only. However, FLT-005's glob patterns match
      against the tool's command parameter, not the display format. The
      established fact confirms that display format bugs don't affect filter
      matching, which operates on JSONL structure.

  - fact: "Fact 3: Synthetic fixtures are unreliable"
    affected_stories: []
    impact: |
      No parsing, filtering, or range stories reference specific fixtures. However,
      testing these stories will require reliable fixtures. Golden files from Pass 3
