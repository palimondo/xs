id: PRIN-009
title: Stable Sequence Numbers

statement: |
  Timeline sequence numbers are assigned from the full chronological timeline
  position and remain stable regardless of filtering. A filtered view may
  show gaps in sequence numbers, but the numbers themselves never change.

rationale: |
  Sequence numbers serve as stable identifiers for events across different
  views of the same session. If sequence numbers changed based on the active
  filter, users could not reference specific events reliably. The gapless
  timeline (PRS-005) assigns numbers once; all downstream operations
  (filtering, display, export) use those assigned numbers.

implications:
  - Numbers assigned from PRS-005 unified timeline, not re-numbered after filtering
  - Compact mode always shows [seq] prefix
  - Truncated/full mode hides numbers by default; --show-numbers reveals them
  - Filtered output may have non-contiguous sequence numbers (triggers -- separators)
  - Range selection uses these stable numbers (e.g., "xs session 10-20" selects events 10-20)

applies_to:
  - PRS-005 # Timeline building with gapless sequence numbers
  - DSP-004 # Sequence number display control
  - RNG-*   # Range selection depends on stable numbering
  - FLT-*   # Filtering preserves original numbers

evidence:
  - "display-modes report: DSP-004 — numbers must be stable, assigned from timeline position, unaffected by filters"
  - "range-selection report: range is independent of display mode and filter flags"
  - "jsonl-parsing report: unified timeline with gapless sequence numbers is central data structure"

status: draft
