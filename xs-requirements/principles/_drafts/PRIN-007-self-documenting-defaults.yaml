id: PRIN-007
title: Self-Documenting Defaults (Summary as Tutorial)

statement: |
  The default xs output (summary mode) should serve as a self-documenting
  tutorial that teaches users how to use xs by showing inline CLI hints
  alongside session statistics.

rationale: |
  The user explicitly designed the summary mode as a teaching tool. Each
  statistic in the summary includes an inline comment showing the CLI flag
  needed to drill down into that category. For example, showing "User: 15  # -U"
  tells the user that -U filters to user messages. This eliminates the need
  to read help text for common operations.

implications:
  - Summary mode is the default (bare `xs <session>` invocation)
  - Each count includes inline parameter hint as comment (e.g., "# -U", "# -i Bash")
  - Tool counts sorted descending, zero-count tools omitted
  - Any filter, range, or search flag implicitly switches from summary to timeline mode
  - Summary format uses valid YAML with capitalized keys
  - Hierarchical tree structure with arithmetic consistency (children sum to parent)

applies_to:
  - SUM-001 # Summary mode statistics and format
  - SUM-002 # MCP tool grouping in summary
  - SUM-003 # Git operations in summary
  - CLI-001 # Summary as default mode
  - CLI-006 # Implicit timeline switch

evidence:
  - "summary report: user designed hierarchical YAML summary with inline parameter hints (b475:301-500, caf2:201-400)"
  - "summary report: SUM-001-AC4 — summary as self-documenting tutorial (e583:1-100)"
  - "cli-interface report: CLI-001 — summary mode as default, self-documenting"
  - "summary report: any filter/range/include/exclude implicitly switches to timeline mode"

pass3_corrections:
  - "No factual errors found. Verified against golden file schema and inventory."

status: draft
