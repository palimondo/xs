id: PRIN-002
title: Canonical Filter Pipeline Ordering

statement: |
  The filter pipeline follows a strict 5-step ordering:
    search -> range -> include -> exclude -> context expansion
  This ordering was stated by the user TWICE in separate sessions and
  bugs were found when it was violated.

rationale: |
  The pipeline ordering determines how different selection mechanisms compose.
  Search narrows first, range selects a window from search results (or full
  timeline), include/exclude further refine, and context expansion (-A/-B/-C)
  adds surrounding events for the final output. Violating this order produces
  duplicates, missing results, or incorrect context windows.

implications:
  - Search (-S) runs first and produces a set of matching events
  - Range (positional args) applies to the full timeline BEFORE filtering (confirmed as intentional)
  - Include (-i) is an OR-whitelist of entity types
  - Exclude (-x) is an AND-blacklist applied after include
  - Context expansion (-A/-B/-C) runs last, adding events around surviving matches
  - No post-filter tail selection currently possible (known gap; --tail proposed but deferred)

applies_to:
  - FLT-*   # All filtering stories
  - RNG-*   # All range selection stories
  - SRC-*   # All search stories
  - CLI-006 # Implicit timeline triggers

evidence:
  - "caf2:301-400 F004 — user stated pipeline ordering"
  - "caf2:901-1000 F001 — user restated pipeline ordering (second time)"
  - "1e83:801-900 F001 — range before filtering confirmed as intentional design"
  - "caf2:1001-1100 F004 — bug: search ignored -i/-x filters (ordering violation)"
  - "range-selection report: canonical pipeline defined in RNG-007"
  - "search report: SRC-007 documents search position as step 0"

pass3_corrections:
  - "No factual errors found. Verified against golden file schema and inventory."

status: draft
