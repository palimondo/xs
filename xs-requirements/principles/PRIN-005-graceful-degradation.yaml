id: PRIN-005
title: Graceful Degradation on Malformed Input

statement: |
  xs must continue processing session data even when individual events
  are malformed, missing fields, or in unexpected formats. Errors should
  be logged or noted but never halt processing of the entire session.

rationale: |
  Real-world JSONL files contain edge cases: empty assistant messages,
  missing timestamps, malformed content blocks, format version mismatches.
  The user expects xs to show what it can rather than crashing on the
  first anomaly. Multiple bugs were documented where xs crashed on
  unexpected content types (list vs string in search, missing fields).

implications:
  - Multi-line JSON parsing must handle partial/malformed objects
  - Missing timestamps should produce "unknown" rather than crash
  - Search over list-type content must not crash (SRC-001 BUG1)
  - Format version differences should be auto-detected and adapted
  - Empty or null content blocks should be skipped gracefully
  - Summary statistics should note "incomplete" when data is missing

applies_to:
  - PRS-*   # All parsing stories (first line of defense)
  - SRC-001 # Search robustness (BUG1: AttributeError on list content)
  - SUM-001 # Summary with missing metadata
  - GFH-003 # JSONL extraction from potentially corrupt logs

evidence:
  - "jsonl-parsing report: multi-line JSON is the critical parsing challenge"
  - "search report: BUG1 — AttributeError when content is a list (tool_result entries)"
  - "search report: BUG3 — search with --full flag causes crash"
  - "summary report: graceful degradation when metadata (timestamps) absent"
  - "fetch report: DT-003 — user scoped out UNKNOWN STEP edge cases but expects manual handling"
  - "fa0d:2501-2532 — compaction failure edge case (empty assistant message)"

status: draft
