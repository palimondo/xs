id: PRIN-002
title: "Canonical five-step filter pipeline"

statement: |
  All event selection uses a single pipeline applied in strict order:
  (0) search by pattern, (1) select by range, (2) include whitelist,
  (3) exclude blacklist, (4) context expansion with dedup.
  This pipeline is implemented once at the event array level and
  shared by all output modes (display, export, search).

rationale: |
  The user explicitly defined this ordering twice in separate sessions
  and asked "why isn't the range-ing implemented once for all output
  styles?" The pipeline must be centralized to avoid per-mode reimplementation
  bugs. Range applies to the FULL unfiltered timeline first, then
  include/exclude narrow the result. Context expansion happens last
  and must merge overlapping windows without duplicates.

implications:
  - "Pipeline is implemented once, not per output mode or sub-command"
  - "Range addresses absolute timeline positions, not filtered positions"
  - "Context expansion must deduplicate overlapping windows"
  - "No duplicate or out-of-order events in output (user called this a 'serious bug')"

applies_to:
  - FLT-011   # Composed filter pipeline
  - RNG-007   # Range-filter interaction
  - SRC-007   # Search-filter pipeline
  - SRC-004   # Context deduplication
  - EXP-003   # Export respects same pipeline

evidence:
  - "Group 1 pattern P2: Canonical pipeline ordering stated twice by user (FLT-011, RNG-007)"
  - "Group 1 constraint C9: Centralized at event array level, not per output mode"
  - "Group 3 pattern P2: Five-step pipeline confirmed across search/filter/range epics"
  - "Group 1 constraint C8: No duplicate events (user: 'serious bug that must be fixed immediately')"

status: fresh
